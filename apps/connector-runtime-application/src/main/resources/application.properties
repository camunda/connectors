server.port=8080

logging.pattern.level=%5p %mdc

management.server.base-path=/actuator
management.endpoints.web.exposure.include=metrics,health,prometheus,loggers
management.endpoint.health.group.readiness.include[]=zeebeClient
management.endpoint.health.group.liveness.include[]=zeebeClient
management.endpoint.health.group.startup.include[]=startupCheck
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

camunda.client.worker.defaults.max-jobs-active=100
camunda.client.worker.defaults.stream-enabled=true

server.max-http-request-header-size=1MB

# Explicit multipart/form-data limits for the inbound webhook endpoint (DispatcherServlet parses
# multipart bodies before the handler runs, so camunda.connector.webhook.max-request-body-bytes
# does not govern them). Pinned rather than left to Spring Boot's own defaults, which match these
# values.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

spring.http.converters.preferred-json-mapper=jackson2