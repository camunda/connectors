server.port=8080

logging.pattern.level=%5p %mdc

# Kept off the public API port (matches the SaaS bundle): operators should not route external
# traffic to this port, so /actuator/** (health, metrics, ...) isn't reachable the same way
# /configurations/validate is.
management.server.port=9080
management.server.base-path=/actuator
management.endpoints.web.exposure.include=metrics,health,prometheus,loggers
management.endpoint.health.group.readiness.include[]=zeebeClient,processDefinitionImport
management.endpoint.health.group.liveness.include[]=zeebeClient
management.endpoint.health.group.startup.include[]=startupCheck
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

camunda.client.worker.defaults.max-jobs-active=100
camunda.client.worker.defaults.stream-enabled=true

server.max-http-request-header-size=1MB
camunda.client.prefer-rest-over-grpc=false
