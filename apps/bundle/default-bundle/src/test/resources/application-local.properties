# uncomment the following line if you need multiple instances of the Runtime
#server.port=0
logging.level.io.camunda.connector=DEBUG
# Config for use with docker-compose-core.yml
camunda.client.mode=self-managed
camunda.client.auth.username=demo
camunda.client.auth.password=demo
camunda.client.auth.token-url=null
# Access from local c4-connectors storybook
camunda.endpoints.cors.allowed.origins=http://localhost:6006
camunda.endpoints.cors.mappings=/inbound-instances/**,/outbound/**
camunda.client.prefer-rest-over-grpc=false
camunda.client.rest-address=http://localhost:8080
camunda.connector.oauth.cache.skew-buffer=PT9S
# TMP: agent tracing PoC. Exports the agent traces to the local Phoenix and Langfuse backends of
# connectors/agentic-ai/examples/tracing (start them with their docker-compose files). A backend that
# is not running only logs exporter errors. The exporters are defined in TmpAgentTracingPocConfiguration.
camunda.connector.agenticai.aiagent.tracing.enabled=true
camunda.connector.agenticai.aiagent.tracing.capture-content=true
management.tracing.sampling.probability=1.0
agent-tracing-poc.phoenix.enabled=true
agent-tracing-poc.phoenix.endpoint=http://localhost:6006/v1/traces
agent-tracing-poc.langfuse.enabled=true
# use 127.0.0.1 instead of localhost if another server on this machine shadows port 3000
agent-tracing-poc.langfuse.endpoint=http://localhost:3000/api/public/otel/v1/traces
# keep the Observation-to-span bridge off so that only agent spans are exported
spring.autoconfigure.exclude=org.springframework.boot.micrometer.tracing.autoconfigure.MicrometerTracingAutoConfiguration
