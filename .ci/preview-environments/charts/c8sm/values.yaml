---
# Default values for the Connectors preview environment

# Global values accessible from any chart or subchart
global:

  # Common labels
  labels:
    # app label will be dynamically set according to preview envrionment name
    app: connectors
    camunda.cloud/managed-by: Helm
    camunda.cloud/source: argocd
    team: connectors

  image:
    pullSecrets:
      - name: dockerhub-registry
      - name: registry-camunda-cloud

  # Preview environment configurations
  preview:
    git:
      # GitHub references for annotating resources
      # Branch name will be dynamically set with PR branch name
      branch: main
      repoUrl: https://github.com/camunda/connectors
    ingress:
      # The domain name under which to expose the preview environment
      domain: connectors.camunda.cloud
    secrets:
      name: camunda-credentials

  # Drives the chart's external URLs (Console links, Web Modeler websocket client).
  # external=true keeps them derived while leaving routing to the Gateway API HTTPRoutes.
  host: '{{ include "ingress.domain" . }}'
  ingress:
    enabled: true
    external: true
    tls:
      enabled: true

  # Camunda 8 Self-Managed global configurations
  identity:
    auth:
      # Enable Camunda Identity-based authentication
      enabled: true
      # Token issuer (Keycloak) URL
      publicIssuerUrl: https://{{ include "ingress.domain" . }}/auth/realms/camunda-platform
      admin:
        enabled: true
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-admin-client-token
      webModeler:
        redirectUrl: https://{{ include "ingress.domain" . }}/modeler
    keycloak:
      contextPath: /auth
      internal: true
      url:
        protocol: http
        host: '{{ .Release.Name }}-kc-service.keycloak-operator'
        port: "8080"
      auth:
        adminUser: admin
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-keycloak-admin-password

  zeebeClusterName: zeebe-cluster

infra-preview-environments-gateway-api:
  baseDomain: connectors.camunda.cloud
  namePrefix: "connectors-"
  gateway:
    name: preview-gateway
    tls:
      secretName: connectors-wildcard-certificate-tls


# Camunda 8 Self-Managed configurations
camunda-platform:

  fullnameOverride: connectors

  # Out-of-the-box Connectors
  connectors:
    enabled: true
    fullnameOverride: connectors
    contextPath: /connectors
    image:
      registry: registry.camunda.cloud
      repository: team-connectors/connectors-bundle
      pullSecrets:
        - name: registry-camunda-cloud
        - name: dockerhub-registry
    security:
      authentication:
        method: oidc
        oidc:
          secret:
            existingSecret: camunda-credentials
            existingSecretKey: identity-connectors-client-token
    env:
      - name: JAVA_OPTS
        value: "-Xms512m -Xmx512m"
      # Required for inbound connectors
      - name: CAMUNDA_CONNECTOR_POLLING_ENABLED
        value: "true"
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 50Mi
    nodeSelector:
      cloud.google.com/gke-nodepool: previews
    tolerations:
      - key: "previews"
        operator: "Exists"
        effect: "NoSchedule"

  orchestration:
    enabled: true
    fullnameOverride: orchestration
    contextPath: /orchestration
    clusterSize: "1"
    partitionCount: "1"
    replicationFactor: "1"
    index:
      replicas: 0
    persistenceType: disk
    pvcSize: 1Gi
    javaOpts: >-
      -Xms512m -Xmx512m
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:HeapDumpPath=/usr/local/zeebe/data
      -XX:ErrorFile=/usr/local/zeebe/data/zeebe_error%p.log
      -XX:+ExitOnOutOfMemoryError
    security:
      authentication:
        method: oidc
        oidc:
          redirectUrl: https://{{ include "ingress.domain" . }}/orchestration
          secret:
            existingSecret: camunda-credentials
            existingSecretKey: identity-orchestration-client-token
    data:
      disk:
        freeSpace:
          processing: 110MB
          replication: 10MB
      secondaryStorage:
        type: elasticsearch
        elasticsearch:
          url: http://elasticsearch-es-http:9200
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    nodeSelector:
      cloud.google.com/gke-nodepool: previews
    tolerations:
      - key: "previews"
        operator: "Exists"
        effect: "NoSchedule"

  identity:
    enabled: true
    fullnameOverride: identity
    contextPath: /identity
    fullURL: https://{{ include "ingress.domain" . }}{{ .Values.identity.contextPath }}
    firstUser:
      enabled: true
      username: demo
      secret:
        existingSecret: camunda-credentials
        existingSecretKey: identity-firstuser-password
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 50Mi
    nodeSelector:
      cloud.google.com/gke-nodepool: previews
    tolerations:
      - key: "previews"
        operator: "Exists"
        effect: "NoSchedule"

  optimize:
    enabled: false

  # Since 8.10 Console is an in-Modeler feature of the Web Modeler restapi pod
  console:
    enabled: true

  camundaHub:
    enabled: false

  webModeler:
    enabled: true
    fullnameOverride: web-modeler
    contextPath: /modeler
    security:
      authentication:
        method: oidc
    restapi:
      externalDatabase:
        host: web-modeler-postgresql-rw
        port: 5432
        database: web-modeler
        username: web-modeler
        secret:
          existingSecret: web-modeler-postgresql-db
          existingSecretKey: password
      mail:
        # This value is required, otherwise, the restapi pod won't start.
        fromAddress: noreply@example.com
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      nodeSelector:
        cloud.google.com/gke-nodepool: previews
      tolerations:
        - key: "previews"
          operator: "Exists"
          effect: "NoSchedule"
    websockets:
      resources:
        limits:
          cpu: 20m
          memory: 64Mi
        requests:
          cpu: 20m
          memory: 64Mi
      nodeSelector:
        cloud.google.com/gke-nodepool: previews
      tolerations:
        - key: "previews"
          operator: "Exists"
          effect: "NoSchedule"
