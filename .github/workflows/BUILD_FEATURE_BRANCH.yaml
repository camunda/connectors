name: Build branch for preview env deployment

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  build-pr-image-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;
            secret/data/products/connectors/ci/common REGISTRY_MINIMUS_PSW;

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: internal
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=8.8
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      # Restore-only: WARM_MAVEN_CACHE.yml saves this from main. Keep the key in sync.
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli

      - name: Package Connectors
        env:
          PROJECTS: bundle/default-bundle
        run: mvn --batch-mode compile generate-sources package -DskipTests --projects "${PROJECTS}" --also-make

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.CI_LDAP_USER }}
          password: ${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}

      - name: Login to Minimus
        uses: docker/login-action@v3
        with:
          registry: reg.mini.dev
          username: minimus
          password: ${{ steps.secrets.outputs.REGISTRY_MINIMUS_PSW }}

      # Publish Docker images for Preview environments
      - name: Build and Push Docker Image tag ${{ env.TAG }} - bundle-default
        env:
          TAG: pr-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: bundle/default-bundle/
          provenance: false
          push: true
          tags: registry.camunda.cloud/team-connectors/connectors-bundle:${{ env.TAG }}