---
name: Build PR Docker Images
on:
  pull_request:
    types: [ labeled, synchronize ]

# Workflow-level default; the job below declares the same, explicit permissions.
permissions:
  contents: read

# One run per PR + trigger; a new push (or re-add of the label) cancels the in-flight
# build, but unrelated labeled events (e.g. deploy-preview) get their own group and
# don't cancel a running image build.
concurrency:
  group: build-pr-docker-images-${{ github.event.pull_request.number }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build PR Docker image artifacts
    # Untrusted stage: builds the PR author's own code. The only secret available here is
    # the read-only CI Nexus account (HeroDevs NES dependencies are not anonymously
    # resolvable) and this never runs on a self-hosted runner - see
    # PUBLISH_PR_DOCKER_IMAGES.yml for the privileged publish stage, which runs from the
    # workflow definition on the default branch (workflow_run) so a PR can't rewrite its
    # own privileged job.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # Vault JWT login (read-only Nexus credential)
    # Skip fork PRs: pull_request runs from forks don't get repository secrets, and this
    # feature has never been offered to forks.
    if: |
      github.event.pull_request.state != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && (
        github.event.label.name == 'docker-images-required' ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'docker-images-required'))
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # build the PR's actual code, not the synthetic merge ref
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: internal
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=8.7
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      # Restore-only: WARM_MAVEN_CACHE.yml saves this from main. Keep the key in sync.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true # cache failures should not fail the build
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        continue-on-error: true # cache failures should not fail the build
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+100000002.0.LTS'

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/nexus USER | CI_NEXUS_USR;
            secret/data/products/connectors/ci/nexus PASSWORD | CI_NEXUS_PSW;

      # Use CI Nexus as pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_NEXUS_USR }}",
               "password": "${{ steps.secrets.outputs.CI_NEXUS_PSW }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global "element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)"

      # Skip tests AND checks: we just need runnable images, not verification
      - name: Package Connectors (skip tests & checks)
        env:
          PROJECTS: connector-runtime/connector-runtime-application,bundle/default-bundle,bundle/camunda-saas-bundle
        run: ./mvnw -B compile generate-sources package -DskipTests -DskipChecks --projects "${PROJECTS}" --also-make

      - name: Record project version
        run: |
          set -euo pipefail
          BASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION="${BASE_VERSION%-SNAPSHOT}"
          echo "${BASE_VERSION}" > pr-build-version.txt

      # Only the built jars (plus the version marker) cross the trust boundary into the
      # privileged publish workflow - never the source tree, never a container image, and
      # never the PR head SHA (the publish workflow derives that solely from its own
      # trusted workflow_run event metadata, not from anything this job produces).
      # pr-build-version.txt sits at the workspace root so upload-artifact's
      # common-ancestor path is the repo root, preserving the module target/ layout the
      # publish job expects.
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-docker-build-jars
          path: |
            connector-runtime/connector-runtime-application/target/*-with-dependencies.jar
            bundle/default-bundle/target/*-with-dependencies.jar
            bundle/camunda-saas-bundle/target/*-with-dependencies.jar
            pr-build-version.txt
          if-no-files-found: error
          retention-days: 1
