---
name: Build PR Docker Images
on:
  pull_request:
    types: [ labeled, synchronize ]

# Workflow-level default; the job below declares the same, explicit permissions.
permissions:
  contents: read

# One run per PR + trigger; a new push (or re-add of the label) cancels the in-flight
# build, but unrelated labeled events (e.g. deploy-preview) get their own group and
# don't cancel a running image build.
concurrency:
  group: build-pr-docker-images-${{ github.event.pull_request.number }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build PR Docker image artifacts
    # Untrusted stage: builds the PR author's own code. No secrets are available here
    # and this never runs on a self-hosted runner - see PUBLISH_PR_DOCKER_IMAGES.yml for
    # the privileged publish stage, which runs from the workflow definition on the
    # default branch (workflow_run) so a PR can't rewrite its own privileged job.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Skip fork PRs: pull_request runs from forks don't get repository secrets, and this
    # feature has never been offered to forks.
    if: |
      github.event.pull_request.state != 'closed' &&
      !startsWith(github.head_ref, 'fix/alwaysgreen-') &&
      github.event.pull_request.head.repo.full_name == github.repository && (
        github.event.label.name == 'docker-images-required' ||
        github.event.label.name == 'deploy-preview' ||
        (github.event.action == 'synchronize' && (
          contains(github.event.pull_request.labels.*.name, 'docker-images-required') ||
          contains(github.event.pull_request.labels.*.name, 'deploy-preview')
        ))
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # build the PR's actual code, not the synthetic merge ref
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Restore cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true # cache failures should not fail the build
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25.0.4+101.0.LTS'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global "element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)"

      # Skip tests AND checks: we just need runnable images, not verification
      - name: Package Connectors (skip tests & checks)
        env:
          PROJECTS: apps/connector-runtime-application,apps/bundle/default-bundle,apps/bundle/camunda-saas-bundle
        run: ./mvnw -B compile generate-sources package -DskipTests -DskipChecks --projects "${PROJECTS}" --also-make

      - name: Record project version
        run: |
          set -euo pipefail
          BASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION="${BASE_VERSION%-SNAPSHOT}"
          echo "${BASE_VERSION}" > pr-build-version.txt

      # Only the built jars (plus the version marker) cross the trust boundary into the
      # privileged publish workflow - never the source tree, never a container image, and
      # never the PR head SHA (the publish workflow derives that solely from its own
      # trusted workflow_run event metadata, not from anything this job produces).
      # pr-build-version.txt sits at the workspace root so upload-artifact's
      # common-ancestor path is the repo root, preserving the apps/.../target/ layout the
      # publish job expects.
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-docker-build-jars
          path: |
            apps/connector-runtime-application/target/*-with-dependencies.jar
            apps/bundle/default-bundle/target/*-with-dependencies.jar
            apps/bundle/camunda-saas-bundle/target/*-with-dependencies.jar
            pr-build-version.txt
          if-no-files-found: error
          retention-days: 1
