---
name: preview-env-clean

on:
  schedule:
  - cron: 0 6,22 * * *
  workflow_call:
    inputs:
      pull-request:
        description: |
          Limit cleanup to a single pull request (number) and a minimal mode.
          Useful for quickly eliminating inconsistencies while waiting for the full cleanup cycle to run.
        required: false
        type: number
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true
  workflow_dispatch:

jobs:
  preview-env-clean:
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pull-request }}
    runs-on: ubuntu-latest
    steps:
    - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # start-build-monitor-1.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Generate a GitHub token
      id: github-token
      uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
      with:
        github-app-id-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_ID
        github-app-id-vault-path: secret/data/products/connectors/ci/common
        github-app-private-key-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_PRIVATE_KEY
        github-app-private-key-vault-path: secret/data/products/connectors/ci/common
        vault-auth-method: approle
        vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
        vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID}}
        vault-url: ${{ secrets.VAULT_ADDR }}

    - uses: camunda/infra-global-github-actions/preview-env/clean@main
      with:
        labels: deploy-preview
        pull-request: ${{ inputs.pull-request }}
        token: ${{ steps.github-token.outputs.token }}
        ttl: 21d
        warning-ttl: 14d

    - name: Import build status secrets
      id: build-status-secrets
      if: always()
      continue-on-error: true
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        exportEnv: false
        secrets: |
          secret/data/products/connectors/ci/ci-analytics gcloud_sa_key;

    - uses: camunda/infra-global-github-actions/submit-build-status@ead99f6c9c536f5c47e443929d47e8fcfdb05a81  # submit-build-status-1.3.3
      if: ${{ always() && steps.build-status-secrets.outputs.gcloud_sa_key != '' }}
      with:
        build_status: "${{ job.status }}"
        gcp_credentials_json: "${{ steps.build-status-secrets.outputs.gcloud_sa_key }}"
