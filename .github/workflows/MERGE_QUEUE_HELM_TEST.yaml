name: Merge queue Helm test

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Limit workflow to 1 concurrent run per ref (branch) and trigger event: new commit -> old runs are canceled to save costs.
# Exception for main + stable/* branches: complete builds for every commit needed for confidence.
concurrency:
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/')) && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and Publish Connectors Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      connectors-version: ${{ steps.connectors-version.outputs.connectors-version }}
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/nexus USER | CI_NEXUS_USR;
            secret/data/products/connectors/ci/nexus PASSWORD | CI_NEXUS_PSW;
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_HARBOR_USR;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_HARBOR_PSW;
            secret/data/products/connectors/ci/common REGISTRY_MINIMUS_PSW;

      - name: Compute Maven cache key
        id: maven-cache-key
        uses: ./.github/actions/maven-cache-key

      # Restore-only: WARM_MAVEN_CACHE.yml saves this from main. Keep the key in sync.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5+8.0.LTS'

      # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_NEXUS_USR }}",
               "password": "${{ steps.secrets.outputs.CI_NEXUS_PSW }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli

      - name: Package Connectors
        env:
          PROJECTS: apps/bundle/default-bundle,apps/bundle/camunda-saas-bundle
        run: ./mvnw --batch-mode compile generate-sources package -DskipTests --projects "${PROJECTS}" --also-make

      - name: Check default-bundle jar exists
        run: ls -lh apps/bundle/default-bundle/target/

      - name: Check saas-bundle jar exists
        run: ls -lh apps/bundle/camunda-saas-bundle/target/

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Harbor
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.CI_HARBOR_USR }}
          password: ${{ steps.secrets.outputs.CI_HARBOR_PSW }}

      - name: Set connectors version
        id: connectors-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAVEN_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION="${MAVEN_VERSION%-SNAPSHOT}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch: <base>-dispatch-run<run_id>-a<run_attempt>
            TAG="${BASE_VERSION}-dispatch-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          else
            # For push to main: <base>-main-run<run_id>-a<run_attempt>
            TAG="${BASE_VERSION}-main-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          echo "::notice::Tag: ${TAG}"
          echo "connectors-version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Minimus
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: reg.mini.dev
          username: minimus
          password: ${{ steps.secrets.outputs.REGISTRY_MINIMUS_PSW }}

      # Publish Docker images for Preview environments
      - name: Build and Push Docker Image tag ${{ env.TAG }} - bundle-default
        env:
          TAG: ${{ steps.connectors-version.outputs.connectors-version }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/bundle/default-bundle/
          provenance: false
          push: true
          tags: registry.camunda.cloud/team-connectors/connectors-bundle:${{ env.TAG }}

      - name: Build and Push Docker Image tag ${{ env.TAG }} - bundle-saas
        env:
          TAG: ${{ steps.connectors-version.outputs.connectors-version }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/bundle/camunda-saas-bundle/
          provenance: false
          push: true
          tags: registry.camunda.cloud/team-connectors/connectors-bundle-saas:${{ env.TAG }}

      - name: Submit build status
        if: always()
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  trigger-sm-e2e:
    name: Trigger SM E2E tests
    needs: [ build-image ]
    if: needs.build-image.outputs.connectors-version != ''
    uses: ./.github/workflows/INTEGRATION_TEST.yml
    secrets: inherit
    with:
      image-source: artifactory
      connectors-version: ${{ needs.build-image.outputs.connectors-version }}
      # Route to the dedicated AlwaysGreen GKE namespace/node pool that finance tracks for cost.
      scenario: alwaysgreen
      shortname: agrn

  # Did the SM stage fail? That is the whole remit -- the one question still asked from
  # inside the run, by the SM feedback job below.
  #
  # It is NOT the general AlwaysGreen failure signal any more. That moved to the watcher
  # in connectors-streak-detector.yml, which judges the finished run from outside it and
  # so covers every stage, every branch and every event. `needs` here is therefore only
  # what answers the SM question: SaaS and the AI-agent job were in this list purely so
  # the old general scan could not read a stage before it concluded, and with the general
  # scan gone, keeping them would make the SM Slack alert wait up to 25 minutes for a
  # SaaS stage it does not look at. SaaS failures are not lost -- `saas-e2e-debug-summary`
  # reports them, and the watcher triages them.
  #
  # Why the jobs API and not `needs.trigger-sm-e2e.result`: the SM Playwright matrix in
  # camunda-platform-helm runs its `full` leg with
  # `continue-on-error: ${{ !matrix.blocking }}`, so a `full`-only failure leaves
  # INTEGRATION_TEST.yml reporting success and that `result` saying `success`. Run
  # 33366607997 is the case -- a red `full` leg and no SM feedback at all. The API
  # reported `conclusion: failure` for the nested job the whole time.
  detect-sm-failure:
    # Keeps the `AlwaysGreen ` prefix: the watcher's scan drops jobs by that prefix so a
    # hiccup in AlwaysGreen's own plumbing is never read as a pipeline failure.
    name: AlwaysGreen SM failure detection
    needs: [ build-image, trigger-sm-e2e ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sm_failed: ${{ steps.scan.outputs.sm_failed }}
    steps:
      - name: Scan the SM stage's job conclusions
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # filter=latest is the default, stated so a re-run cannot pick up a previous
          # attempt's failures and re-report a failure that is already gone.
          #
          # --slurp and flatten: --paginate emits one document per page, and past 100
          # jobs an unslurped grep would still work but the count below would not.
          #
          # The same conclusions the watcher and the classifier count, or an SM job that
          # hits its own timeout-minutes gets triaged with no Slack message and no PR
          # comment to go with it. A job timeout is reported as `cancelled`, not
          # `timed_out` -- that is what the 100-run sample shows -- so `cancelled` has to
          # be in here for the timeout case to be covered at all.
          #
          # The watcher's whole-run exception cannot be applied here: this job runs while
          # the run is still in progress, so the run has no conclusion yet. That leaves
          # one false-alert shape -- a run cancelled as a whole, where this job survives
          # long enough to see a cancelled SM job. It is the right way round to be wrong:
          # this job posts a Slack message, it dispatches nothing, and a
          # rare message about a cancelled run costs less than silence on a real SM
          # timeout. Dispatch decisions stay with the watcher, which can tell the two
          # apart.
          failed=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            | jq -r '[.[].jobs[]]
                     | .[]
                     | select(.conclusion as $c
                              | ["failure", "cancelled", "timed_out"] | index($c))
                     | .name')

          # Nested jobs of the called SM workflow appear under
          # `Trigger SM E2E tests / ...`, which is what makes a non-blocking Playwright
          # leg visible here when `needs.trigger-sm-e2e.result` still says success.
          sm_failed=false
          if printf '%s\n' "$failed" | grep -q '^Trigger SM E2E tests'; then
            sm_failed=true
            printf 'Failing SM jobs:\n%s\n' \
              "$(printf '%s\n' "$failed" | grep '^Trigger SM E2E tests')"
          else
            echo "No failing SM jobs in this run."
          fi

          echo "sm_failed=${sm_failed}" | tee -a "$GITHUB_OUTPUT"

  sm-e2e-debug-summary:
    name: AlwaysGreen failure feedback (SM E2E)
    needs: [ trigger-sm-e2e, detect-sm-failure ]
    # Not needs.trigger-sm-e2e.result: a non-blocking SM leg failing leaves that at
    # `success`, which is how run 33366607997 produced no SM feedback at all.
    if: always() && needs.detect-sm-failure.outputs.sm_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Triage replies in this message's thread rather than opening a second
      # top-level alert for the same failure.
      slack_ts: ${{ steps.feedback.outputs.slack_ts }}
      slack_channel: ${{ steps.feedback.outputs.slack_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Generate GitHub App Token
        id: app-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@9965a08067900e11c602a050b8821ec92f49544b # main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors
      # Standardised AlwaysGreen feedback → job summary (+ Slack once the channel
      # is set below and the bot is invited to it). Best-effort.
      - name: Post AlwaysGreen failure feedback
        id: feedback
        continue-on-error: true
        uses: ./.github/actions/post-failure-feedback
        with:
          failure_category: unknown
          stage: sm-e2e-helm
          owner_team: "@camunda/connectors"
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status: failure
          evidence: "SM E2E / Helm Integration Tests failed."
          # Shared AlwaysGreen channel (#alwaysgreen-reliability) — consistent
          # across all AlwaysGreen repos. The connectors bot must be a member.
          slack_channel: "C0AK0AVKRL0"
          slack_bot_token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}

  trigger-saas-e2e:
    name: Trigger SaaS E2E tests
    runs-on: ubuntu-latest
    needs: [ build-image ]
    if: needs.build-image.outputs.connectors-version != ''
    # Dispatch only. The downstream run reports back through a `saas-e2e-result`
    # repository_dispatch handled by SAAS_E2E_RESULT.yaml, so no runner waits for it.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - name: Generate GitHub App Token (for dispatch)
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@9965a08067900e11c602a050b8821ec92f49544b # main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors,c8-cross-component-e2e-tests

      - name: Check downstream SaaS workflow is enabled
        id: check-downstream
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          # Fail CLOSED on the gate (see the two dispatch/wait steps below,
          # which require enabled == 'true' explicitly) but fail OPEN on
          # inability to determine state: a transient API blip here must not
          # silently skip real SaaS coverage on an otherwise-normal PR, so a
          # retry-exhausted check falls back to the pre-this-PR behavior
          # (dispatch as usual) rather than skipping.
          STATE=""
          for attempt in 1 2 3; do
            if STATE="$(gh api repos/camunda/c8-cross-component-e2e-tests/actions/workflows/playwright_saas_pr_trigger_connectors.yml --jq .state 2>&1)"; then
              break
            fi
            echo "::warning::Attempt ${attempt}/3 to read downstream workflow state failed: $STATE" >&2
            STATE=""
            [[ $attempt -lt 3 ]] && sleep $((attempt * 5))
          done

          if [[ -z "$STATE" ]]; then
            echo "::warning::Could not determine downstream workflow state after 3 attempts -- defaulting to enabled so a transient API issue doesn't silently skip real SaaS coverage."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATE" != "active" ]]; then
            echo "Downstream workflow state: $STATE"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SaaS E2E tests skipped"
              echo ""
              echo "The downstream workflow (\`playwright_saas_pr_trigger_connectors.yml\` in camunda/c8-cross-component-e2e-tests) is currently **${STATE}**, not active -- skipping dispatch instead of waiting for a run that will never start."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Downstream workflow state: $STATE"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger repository_dispatch for SaaS Connectors
        if: steps.check-downstream.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
          CORRELATION_ID: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
          IMAGE_TAG: ${{ needs.build-image.outputs.connectors-version }}
        run: |
          # Use the image tag as the generation name to match filter patterns
          # e.g., "8.11.0-main-run12345678-a1" matches "**-main-run**-a**"
          GEN_NAME="${IMAGE_TAG}"

          # The `-callback` event type opts this run into the `saas-e2e-result`
          # callback; stable-branch copies of this pipeline send the plain type and keep
          # waiting for the downstream run themselves. It is the event type rather than
          # a payload flag because client_payload is capped at 10 top-level properties,
          # all already in use. Branch, event and PR are not sent either: the result
          # workflow reads them from this run, found through the correlation id.
          PAYLOAD=$(jq -n \
            --arg correlation_id "$CORRELATION_ID" \
            --arg source_repo "${{ github.repository }}" \
            --arg source_sha "${{ github.sha }}" \
            --arg gen_name "$GEN_NAME" \
            --arg connectors_version "$IMAGE_TAG" \
            '{
              event_type: "run-saas-generation-smoke-connectors-callback",
              client_payload: {
                correlation_id: $correlation_id,
                source_repo: $source_repo,
                source_sha: $source_sha,
                gen_name: $gen_name,
                c8Version: "8.11",
                zeebeVersion: "SNAPSHOT",
                operateVersion: "SNAPSHOT",
                tasklistVersion: "SNAPSHOT",
                connectorsVersion: $connectors_version,
                optimizeVersion: "SNAPSHOT"
              }
            }')

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/camunda/c8-cross-component-e2e-tests/dispatches \
            -d "$PAYLOAD"

      - name: Add SaaS dispatch note to Job Summary
        if: steps.check-downstream.outputs.enabled == 'true'
        run: |
          {
            echo "### SaaS E2E dispatched"
            echo ""
            echo "**Correlation ID:** \`${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}\`"
            echo ""
            echo "The result is reported by the \`SaaS E2E result\` workflow when the downstream run finishes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit build status
        if: always()
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  run-ai-agent-cpt:
    name: AI Agent bundle E2E (CPT)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [ build-image ]
    if: needs.build-image.outputs.connectors-version != ''
    timeout-minutes: 20
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for agentic-ai changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            ai:
              - 'connectors/agentic-ai/**'
              - 'connectors-e2e-test/connectors-e2e-test-agentic-ai/**'

      - name: Import Secrets
        if: steps.changes.outputs.ai == 'true'
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;
            secret/data/products/qa/ci/cross-component-e2e-test-suite OPENAI_API_KEY;
            secret/data/products/qa/ci/cross-component-e2e-test-suite IDP_GCP_SERVICE_ACCOUNT;
            secret/data/products/qa/ci/cross-component-e2e-test-suite IDP_GCP_VERTEX_PROJECT_ID;
            secret/data/products/qa/ci/cross-component-e2e-test-suite IDP_GCP_VERTEX_REGION;

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.changes.outputs.ai == 'true'
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"

      - name: Login to Harbor
        if: steps.changes.outputs.ai == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.CI_LDAP_USER }}
          password: ${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}

      - name: Create settings.xml
        if: steps.changes.outputs.ai == 'true'
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - name: Compute Maven cache key
        if: steps.changes.outputs.ai == 'true'
        id: maven-cache-key
        uses: ./.github/actions/maven-cache-key

      # Restore-only: WARM_MAVEN_CACHE.yml saves this from main. Keep the key in sync.
      - name: Restore Maven cache
        if: steps.changes.outputs.ai == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        if: steps.changes.outputs.ai == 'true'
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.ai == 'true'
        with:
          node-version: '24'

      - name: Install element templates CLI
        if: steps.changes.outputs.ai == 'true'
        run: npm install --global element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)

      # Upstream modules are only needed as dependencies here, so they install without their
      # own tests or checks. The image under test comes from build-image, not from this build.
      - name: Install reactor dependencies (skip tests and checks)
        if: steps.changes.outputs.ai == 'true'
        run: |
          ./mvnw --batch-mode install -DskipTests -DskipChecks \
            --projects connectors-e2e-test/connectors-e2e-test-agentic-ai/connectors-e2e-test-agentic-ai-real-llm \
            --also-make

      # No `-am` here: the previous step already installed the dependencies, so this stays
      # scoped to the real LLM E2E module instead of re-running every upstream module's tests.
      - name: Run AI Agent E2E tests
        if: steps.changes.outputs.ai == 'true'
        env:
          CONNECTORS_IMAGE_NAME: registry.camunda.cloud/team-connectors/connectors-bundle
          CONNECTORS_IMAGE_VERSION: ${{ needs.build-image.outputs.connectors-version }}
          OPENAI_API_KEY: ${{ steps.secrets.outputs.OPENAI_API_KEY }}
          GOOGLE_VERTEX_AI_SERVICE_ACCOUNT: ${{ steps.secrets.outputs.IDP_GCP_SERVICE_ACCOUNT }}
          GOOGLE_VERTEX_AI_PROJECT_ID: ${{ steps.secrets.outputs.IDP_GCP_VERTEX_PROJECT_ID }}
          GOOGLE_VERTEX_AI_REGION: ${{ steps.secrets.outputs.IDP_GCP_VERTEX_REGION }}
        run: |
          ./mvnw verify \
            -pl connectors-e2e-test/connectors-e2e-test-agentic-ai/connectors-e2e-test-agentic-ai-real-llm \
            -Pit-real-llm \
            --batch-mode

      - name: Submit build status
        if: always() && steps.changes.outputs.ai == 'true'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  # Triage is NOT a job here. It runs from connectors-streak-detector.yml, a workflow_run
  # listener on the default branch, so one gate covers this branch and every stable/8.x
  # instead of a per-branch `if:` that only this copy of the file ever received.
  #
  # The stable branches still have their copy of this job, so the listener checks whether
  # an in-pipeline triage already classified a run and stands down when it did -- two
  # classifications would mean two Slack threads for one failure. That check stops
  # matching by itself as each stable branch drops the job.
