name: Merge queue Helm test

on:
  push:
    branches:
      - stable/8.9
  workflow_dispatch:
  merge_group:

# Limit workflow to 1 concurrent run per ref (branch) and trigger event: new commit -> old runs are canceled to save costs.
# Exception for main + stable/* branches: complete builds for every commit needed for confidence.
concurrency:
  group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name, (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/stable/')) && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and Publish Connectors Docker Image
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    outputs:
      connectors-version: ${{ steps.connectors-version.outputs.connectors-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;
            secret/data/products/connectors/ci/common REGISTRY_MINIMUS_PSW;

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21.0.9'

      # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli

      - name: Package Connectors
        env:
          PROJECTS: bundle/default-bundle,bundle/camunda-saas-bundle
        run: ./mvnw --batch-mode compile generate-sources package -DskipTests --projects "${PROJECTS}" --also-make

      - name: Check default-bundle jar exists
        run: ls -lh bundle/default-bundle/target/

      - name: Check saas-bundle jar exists
        run: ls -lh bundle/camunda-saas-bundle/target/

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.camunda.cloud
          username: ${{ steps.secrets.outputs.CI_LDAP_USER }}
          password: ${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}

      - name: Set connectors version
        id: connectors-version
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          MAVEN_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION="${MAVEN_VERSION%-SNAPSHOT}"

          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # merge_group.head_ref looks like refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>
            PR_NUMBER=$(printf '%s' "$HEAD_REF" | sed -nE 's|.*/pr-([0-9]+)-.*|\1|p')
            if [[ -z "$PR_NUMBER" ]]; then
              echo "::notice::No PR number could be extracted from merge_group head_ref: $HEAD_REF"
              echo "should-push=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="${BASE_VERSION}-pr${PR_NUMBER}-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch: <base>-dispatch-run<run_id>-a<run_attempt>
            TAG="${BASE_VERSION}-dispatch-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          else
            # For push to stable/8.9: <base>-stable-8.9-run<run_id>-a<run_attempt>
            TAG="${BASE_VERSION}-stable-8.9-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          echo "::notice::Tag: ${TAG}"
          echo "connectors-version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should-push=true" >> "$GITHUB_OUTPUT"

      - name: Login to Minimus
        uses: docker/login-action@v4
        with:
          registry: reg.mini.dev
          username: minimus
          password: ${{ steps.secrets.outputs.REGISTRY_MINIMUS_PSW }}

      # Publish Docker images for Preview environments
      - name: Build and Push Docker Image tag ${{ env.TAG }} - bundle-default
        if: ${{ steps.connectors-version.outputs.should-push == 'true' }}
        env:
          TAG: ${{ steps.connectors-version.outputs.connectors-version }}
        uses: docker/build-push-action@v7
        with:
          context: bundle/default-bundle/
          provenance: false
          push: true
          tags: registry.camunda.cloud/team-connectors/connectors-bundle:${{ env.TAG }}

      - name: Build and Push Docker Image tag ${{ env.TAG }} - bundle-saas
        if: ${{ steps.connectors-version.outputs.should-push == 'true' }}
        env:
          TAG: ${{ steps.connectors-version.outputs.connectors-version }}
        uses: docker/build-push-action@v7
        with:
          context: bundle/camunda-saas-bundle/
          provenance: false
          push: true
          tags: registry.camunda.cloud/team-connectors/connectors-bundle-saas:${{ env.TAG }}

  trigger-sm-e2e:
    name: Trigger SM E2E tests
    needs: [ build-image ]
    if: needs.build-image.outputs.connectors-version != ''
    uses: ./.github/workflows/INTEGRATION_TEST.yml
    secrets: inherit
    with:
      image-source: artifactory
      connectors-version: ${{ needs.build-image.outputs.connectors-version }}
      release-branch: stable/8.9
      helm-dir: camunda-platform-8.9
      # Route to the dedicated AlwaysGreen GKE namespace/node pool that finance tracks for cost.
      scenario: alwaysgreen
      shortname: agrn
  sm-e2e-debug-summary:
    name: AlwaysGreen failure feedback (SM E2E)
    needs: trigger-sm-e2e
    if: always() && needs.trigger-sm-e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    permissions:
      pull-requests: write
      contents: read
    outputs:
      # Triage replies in this message's thread rather than opening a second
      # top-level alert for the same failure.
      slack_ts: ${{ steps.feedback.outputs.slack_ts }}
      slack_channel: ${{ steps.feedback.outputs.slack_channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate GitHub App Token
        id: app-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors
      - name: Post AlwaysGreen failure feedback
        id: feedback
        continue-on-error: true
        uses: camunda/connectors/.github/actions/post-failure-feedback@main
        with:
          failure_category: unknown
          stage: sm-e2e-helm
          owner_team: "@camunda/connectors"
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status: failure
          evidence: "SM E2E / Helm Integration Tests failed."
          pr: ${{ github.event.merge_group.head_ref }}
          slack_channel: "C0AK0AVKRL0"
          slack_bot_token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
  trigger-saas-e2e:
    name: Trigger SaaS E2E tests
    runs-on: ubuntu-latest
    needs: [ build-image ]
    if: needs.build-image.outputs.connectors-version != ''
    # Must stay above `wait-downstream`'s own 50min deadline. When this fires
    # first the runner kills the step mid-poll, the job lands as `cancelled`,
    # and the loop's timeout path never runs -- so the failure surfaces with
    # no reason attached. Keep the loop as the timeout mechanism and this as
    # the backstop for what a deadline cannot bound: a single `gh api` call
    # that hangs indefinitely rather than returning an error to retry.
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    permissions: { }
    outputs:
      # Whether this job failed, stated explicitly. On merge_group the job carries
      # continue-on-error, and GitHub does not document what needs.<job>.result then
      # reports to a dependent job — so a gate built on that alone could silently never
      # fire for the one event that supplies a PR to comment on.
      status: ${{ steps.job-status.outputs.status }}
    steps:
      # The waiter's deadline has to be measured on the same clock as this
      # job's `timeout-minutes`, which starts here -- not when the waiter
      # step happens to begin. Checkout, Vault/token generation and the
      # dispatch are all unbounded, so deriving the deadline from the
      # waiter's own start would make "deadline < job timeout" an assumption
      # about how long they take rather than a guarantee.
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub App Token (for dispatch)
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors,c8-cross-component-e2e-tests

      - name: Check downstream SaaS workflow is enabled
        id: check-downstream
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          # Fail CLOSED on the gate (see the two dispatch/wait steps below,
          # which require enabled == 'true' explicitly) but fail OPEN on
          # inability to determine state: a transient API blip here must not
          # silently skip real SaaS coverage on an otherwise-normal PR, so a
          # retry-exhausted check falls back to the pre-this-PR behavior
          # (dispatch as usual) rather than skipping.
          STATE=""
          for attempt in 1 2 3; do
            if STATE="$(gh api repos/camunda/c8-cross-component-e2e-tests/actions/workflows/playwright_saas_pr_trigger_connectors.yml --jq .state 2>&1)"; then
              break
            fi
            echo "::warning::Attempt ${attempt}/3 to read downstream workflow state failed: $STATE" >&2
            STATE=""
            [[ $attempt -lt 3 ]] && sleep $((attempt * 5))
          done

          if [[ -z "$STATE" ]]; then
            echo "::warning::Could not determine downstream workflow state after 3 attempts -- defaulting to enabled so a transient API issue doesn't silently skip real SaaS coverage."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATE" != "active" ]]; then
            echo "Downstream workflow state: $STATE"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SaaS E2E tests skipped"
              echo ""
              echo "The downstream workflow (\`playwright_saas_pr_trigger_connectors.yml\` in camunda/c8-cross-component-e2e-tests) is currently **${STATE}**, not active -- skipping dispatch instead of waiting for a run that will never start."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Downstream workflow state: $STATE"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger repository_dispatch for SaaS Connectors
        if: steps.check-downstream.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
          CORRELATION_ID: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
          IMAGE_TAG: ${{ needs.build-image.outputs.connectors-version }}
        run: |
          # Use the image tag as the generation name to match filter patterns
          # e.g., "8.9.0-stable-8.9-run12345678-a1" matches "**-stable-8.9-run**-a**"
          GEN_NAME="${IMAGE_TAG}"

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/camunda/c8-cross-component-e2e-tests/dispatches \
            -d '{
                  "event_type": "run-saas-generation-smoke-connectors",
                  "client_payload": {
                      "correlation_id": "'"$CORRELATION_ID"'",
                      "source_repo": "${{ github.repository }}",
                      "source_sha": "${{ github.sha }}",
                      "gen_name": "'"${GEN_NAME}"'",
                      "c8Version": "8.9",
                      "zeebeVersion": "8.9-SNAPSHOT",
                      "operateVersion": "8.9-SNAPSHOT",
                      "tasklistVersion": "8.9-SNAPSHOT",
                      "connectorsVersion": "${{ needs.build-image.outputs.connectors-version }}",
                      "optimizeVersion": "8.9-SNAPSHOT"
                  }
                }'

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: trigger-saas-e2e
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

      - name: Wait for downstream workflow to finish
        id: wait-downstream
        if: steps.check-downstream.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          CORRELATION_ID: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for downstream E2E workflow run in camunda/c8-cross-component-e2e-tests for correlation id: $CORRELATION_ID"

          TARGET_REPO="camunda/c8-cross-component-e2e-tests"
          WORKFLOW_FILE="playwright_saas_pr_trigger_connectors.yml"

          # Bound the wait by wall clock rather than by a tick count. A tick
          # is not a fixed cost: a poll whose `gh_api_with_retry` exhausts its
          # backoff burns up to 62s on top of the 30s tick. So a tick count
          # sized to the budget below -- 100 ticks for 50min -- would say
          # nothing about how long the step actually runs: ~50min at best,
          # ~153min at worst. (These figures describe the budget this job
          # uses today, not the tick loop that used to be here.) Only an
          # absolute deadline keeps the loop -- not the runner -- the thing
          # that ends the wait, which is what lets the timeout path below
          # report a reason.
          #
          # Size this off the runs the budget can actually bind on: the ones
          # still in progress when it expires, which are overwhelmingly the
          # long green ones. The all-runs distribution (median ~18min, p90
          # ~33min, p95 ~38min) is dragged down by fast failures, whose median
          # is ~6min and which can never reach any budget -- sizing off it
          # under-states what a passing run costs. Over the 129 green
          # downstream runs between 2026-09-03 and 2026-09-21 the median is
          # ~20min, p90 ~33min and p95 ~44min, so 50min leaves 98.4% of them
          # room to finish. Raise it if that suite grows, and keep the
          # job-level `timeout-minutes` above it.
          #
          # Anchored to the job's start, not this step's, so the 10min of
          # headroom below the job timeout cannot be eaten by a slow checkout
          # or a hanging Vault call. The preamble normally costs seconds; if
          # it ever costs more, the wait shortens instead of the runner
          # killing the loop before it can report a timeout.
          WAIT_DEADLINE=$(( ${JOB_STARTED_AT:-$(date +%s)} + 50 * 60 ))

          # Never sleep past the deadline: both the loop condition and the
          # retry backoff are only re-checked between sleeps, so an unguarded
          # sleep is exactly how the overshoot creeps back in.
          deadline_sleep() {
            local want="$1" remaining
            remaining=$(( WAIT_DEADLINE - $(date +%s) ))
            if (( remaining <= 0 )); then
              return 0
            fi
            if (( remaining > want )); then
              remaining="$want"
            fi
            sleep "$remaining"
          }

          gh_api_with_retry() {
            local endpoint="$1"
            local max_attempts="${2:-6}"
            local sleep_s="${3:-2}"
            local attempt=1
            local out

            while true; do
              if out="$(gh api "$endpoint" 2>&1)"; then
                printf '%s' "$out"
                return 0
              fi

              # Rate limiting is matched by message, not by status code. GitHub
              # serves the primary limit as 403 and the secondary limit as 403
              # or 429, and a plain 403 is the permanent case this function
              # exists to separate out (a bad token, a repo the App cannot
              # see). Matching `HTTP 403` wholesale would poll a dead token to
              # the deadline instead of failing fast, so only the rate-limit
              # wording -- and 429, which is never anything else -- is treated
              # as transient. `abuse detection` is the same family: GitHub's
              # older wording for the secondary limit, served as 403 and
              # self-clearing, so it retries for the same reason.
              if echo "$out" | grep -Eqi 'HTTP 429|rate limit|abuse detection|HTTP 500|HTTP 502|HTTP 503|HTTP 504|TLS handshake timeout|timeout|temporarily unavailable|connection reset by peer|EOF|tls: failed to verify certificate|x509: certificate|stream error|GOAWAY|broken pipe|no such host|connection refused'; then
                if (( attempt >= max_attempts )); then
                  echo "gh api failed after ${attempt}/${max_attempts} attempts for $endpoint" >&2
                  echo "$out" >&2
                  return 1
                fi
                echo "Transient gh/api error (attempt ${attempt}/${max_attempts}) for $endpoint:" >&2
                echo "$out" >&2
                deadline_sleep "$sleep_s"
                # Do not start another attempt past the deadline. Once the
                # clamped sleep has run the budget out, a further `gh api`
                # could stall -- and a stalled call is the one thing a
                # deadline cannot bound, which would hand the kill back to
                # the runner and lose the timeout report.
                if (( $(date +%s) >= WAIT_DEADLINE )); then
                  echo "Deadline reached while retrying $endpoint; abandoning this poll." >&2
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep_s=$((sleep_s * 2))
                continue
              fi

              # Exit code 2 marks a permanent error (bad token, renamed workflow
              # file) so the caller fails fast instead of polling to the timeout,
              # and is distinguishable from the retry-exhausted 1 above -- which
              # must NOT end the wait, since a transient blip that outlasts the
              # backoff is exactly what the next tick is for.
              echo "Non-retryable gh/api error for $endpoint:" >&2
              echo "$out" >&2
              return 2
            done
          }

          RUN_ID=""

          while (( $(date +%s) < WAIT_DEADLINE )); do
            if [[ -z "$RUN_ID" ]]; then
              # Capture the API call separately from the jq parse. Piping it
              # straight into jq under `set -o pipefail` made a retry-exhausted
              # transient blip abort the whole step, so a 30s GitHub hiccup
              # failed the merge-queue gate instead of being retried on the
              # next tick. Only a permanent error (exit 2) aborts now.
              RUNS_JSON="" RC=0
              RUNS_JSON="$(gh_api_with_retry "/repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=repository_dispatch&per_page=50")" || RC=$?
              if (( RC == 2 )); then
                exit 1
              elif (( RC != 0 )); then
                echo "Could not list downstream runs on this poll; retrying on the next tick." >&2
                deadline_sleep 30
                continue
              fi

              RUN_ID=$(
                jq -r --arg c "$CORRELATION_ID" '
                    .workflow_runs
                    | map(select(.display_title != null and (.display_title | contains($c))))
                    | sort_by(.created_at)
                    | last
                    | .id // empty
                  ' <<<"$RUNS_JSON"
              )

              if [[ -z "$RUN_ID" ]]; then
                echo "No downstream run found yet for correlation id. Sleeping..."
                deadline_sleep 30
                continue
              fi

              echo "Locked onto downstream run id: $RUN_ID"
              echo "downstream_run_url=https://github.com/$TARGET_REPO/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

              # Re-check before falling through to the status request below.
              # Every other iteration reaches it with the loop's own deadline
              # check immediately behind it, but this one has an unbounded
              # `gh api` in between: the run-list call can start inside the
              # budget and return outside it. Starting a fresh unbounded call
              # on a spent budget is what hands the kill back to the runner --
              # a hang there only has the 10min of job-timeout headroom to
              # land in, and past that the job dies as `cancelled` with no
              # timeout report. The run url is already written above, so the
              # report still carries the link.
              if (( $(date +%s) >= WAIT_DEADLINE )); then
                echo "Deadline reached while locking onto run $RUN_ID; reporting the timeout instead of starting another poll." >&2
                break
              fi
            fi

            RUN_JSON="" RC=0
            RUN_JSON="$(gh_api_with_retry "/repos/$TARGET_REPO/actions/runs/$RUN_ID")" || RC=$?
            if (( RC == 2 )); then
              exit 1
            elif (( RC != 0 )); then
              echo "Could not read downstream run $RUN_ID on this poll; retrying on the next tick." >&2
              deadline_sleep 30
              continue
            fi

            STATUS="$(jq -r .status <<<"$RUN_JSON")"
            CONCLUSION="$(jq -r .conclusion <<<"$RUN_JSON")"
            echo "Workflow run $RUN_ID status: $STATUS ($CONCLUSION)"

            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "Downstream workflow succeeded!"
                exit 0
              else
                echo "Downstream workflow failed: $CONCLUSION"
                exit 1
              fi
            fi

            deadline_sleep 30
          done

          echo "Timed out waiting for downstream workflow to complete."
          exit 1

      - name: Add SaaS downstream workflow link to Job Summary
        if: always()
        run: |
          if [ -n "${{ steps.wait-downstream.outputs.downstream_run_url }}" ]; then
            {
              echo "### SaaS Downstream Workflow Run"
              echo ""
              echo "**Correlation ID:** \`${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}\`"
              echo ""
              echo "[Open the triggered SaaS E2E workflow run in camunda/c8-cross-component-e2e-tests](${{ steps.wait-downstream.outputs.downstream_run_url }})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No downstream workflow run URL found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # AlwaysGreen triage runs in this repository but the SaaS evidence lives on the
      # downstream run in c8-cross-component-e2e-tests, and a job summary is not
      # machine-readable. This artifact is the only channel that carries the link
      # across; without it triage classifies every SaaS failure as saas-infra and
      # dispatches nothing. Deliberately just the link: triage recomputes the
      # category from the downstream report itself.
      - name: Write SaaS downstream context for AlwaysGreen triage
        id: saas-context
        if: always() && steps.wait-downstream.outputs.downstream_run_url != ''
        env:
          DOWNSTREAM_RUN_URL: ${{ steps.wait-downstream.outputs.downstream_run_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg stage "${{ github.job }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg downstream_run_url "${DOWNSTREAM_RUN_URL}" \
            '{stage: $stage, run_url: $run_url, downstream_run_url: $downstream_run_url}' \
            > "${RUNNER_TEMP}/alwaysgreen-saas-category.json"

      - name: Upload SaaS downstream context artifact
        if: always() && steps.saas-context.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: alwaysgreen-saas-category
          path: ${{ runner.temp }}/alwaysgreen-saas-category.json
          retention-days: 14
          # Artifacts are immutable and a re-run reuses the run id, so without this the
          # second attempt fails to upload and triage reads the first attempt's stale
          # downstream link — pointing the fix agent at the wrong evidence.
          overwrite: true

      - name: Add debugging guidance on failure
        # `always() &&` is load-bearing: an `if` with no status-check function
        # gets an implicit `success()`, and the waiter having failed is exactly
        # when that is false -- so without it this step is skipped on the only
        # path it exists for, and the timeout the loop reports lands with no
        # guidance attached.
        if: always() && steps.wait-downstream.outcome == 'failure'
        run: |
          DOWNSTREAM_URL="${{ steps.wait-downstream.outputs.downstream_run_url }}"
          COOKBOOK_URL="https://github.com/camunda/c8-cross-component-e2e-tests/blob/main/docs/ci-debugging-cookbook.md"
          {
            echo ""
            echo "### Debugging the SaaS E2E Failure"
            echo ""
            if [ -n "$DOWNSTREAM_URL" ]; then
              echo "**Downstream run:** [$DOWNSTREAM_URL]($DOWNSTREAM_URL)"
              echo ""
            fi
            echo "**Full guide:** [CI Debugging Cookbook — SaaS E2E section](${COOKBOOK_URL}#failure-type-5--saas-e2e-tests)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Last step in the job, so job.status here reflects everything above it.
      - name: Record job status
        id: job-status
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # Mirror of sm-e2e-debug-summary. Until this existed a SaaS failure produced no
  # Slack message and no PR comment at all — only the streak detector's aggregate,
  # which fires at three consecutive failures and says nothing about a single one.
  saas-e2e-debug-summary:
    name: AlwaysGreen failure feedback (SaaS E2E)
    needs: trigger-saas-e2e
    # Two signals for one condition. `result` covers push, where the job fails
    # normally; the explicit output covers merge_group, where continue-on-error may
    # present the failure to dependents as a success. merge_group is the only trigger
    # that supplies a PR, so relying on `result` alone risks the PR comment never
    # being posted at all.
    if: >-
      always() && (needs.trigger-saas-e2e.result == 'failure' ||
      needs.trigger-saas-e2e.outputs.status == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    permissions:
      pull-requests: write
      contents: read
    outputs:
      slack_ts: ${{ steps.feedback.outputs.slack_ts }}
      slack_channel: ${{ steps.feedback.outputs.slack_channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Generate GitHub App Token
        id: app-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@main
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors
      - name: Post AlwaysGreen failure feedback
        id: feedback
        continue-on-error: true
        uses: camunda/connectors/.github/actions/post-failure-feedback@main
        with:
          failure_category: unknown
          stage: saas-e2e
          owner_team: "@camunda/connectors"
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status: failure
          evidence: "SaaS E2E tests failed. The downstream run in c8-cross-component-e2e-tests is linked from the Trigger SaaS E2E tests job summary."
          pr: ${{ github.event.merge_group.head_ref }}
          # merge_group is the only trigger here that supplies a PR, and a
          # draft cannot enter a merge queue -- so state the answer instead of
          # paying for a lookup that would also need pull-requests: read.
          pr_is_draft: "false"
          slack_channel: "C0AK0AVKRL0"
          slack_bot_token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}

