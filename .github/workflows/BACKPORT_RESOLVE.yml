name: Resolve backport conflicts
run-name: Resolve backport conflicts

# Dispatched by BACKPORT_PR.yml for every backport PR the action opened as a draft,
# i.e. every one whose cherry-pick hit a conflict and had that conflict committed.
# Runs the Claude Code CLI over the checkout, replays the cherry-pick cleanly, and
# force-pushes the resolution only if it builds.
#
# Split into two jobs on purpose. `resolve` runs the agent with `--dangerously-skip-
# permissions` and unrestricted shell access to the checkout; it never holds a
# write-capable GitHub credential, only read access via the default GITHUB_TOKEN.
# `apply` does the actual push, PR-ready, and comment on a separate, fresh runner
# the agent never touched, using the App token. A same-job trusted step after an
# untrusted one isn't a real boundary — the untrusted step can persist environment
# and PATH changes via $GITHUB_ENV/$GITHUB_PATH into every later step of that job,
# so isolating `HOME`/git config in-job (an earlier version of this workflow did
# that) is bypassable. A separate job gets a genuinely clean environment instead.

on:
  workflow_dispatch:
    inputs:
      backport_pr:
        description: >
          Number of the draft backport PR to resolve.
        required: true
        type: string

env:
  # korthout/backport-action always runs with this App's token, so it's who opens
  # every backport PR and posts every conflict-instruction comment. Fixed rather
  # than derived from a token's app-slug, so the `resolve` job never needs one.
  BOT_LOGIN: team-connectors-int-automation[bot]

concurrency:
  group: backport-resolve-${{ inputs.backport_pr }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head: ${{ steps.ctx.outputs.head }}
      pre_sha: ${{ steps.pre.outputs.head_sha }}
      source_author: ${{ steps.ctx.outputs.source_author }}
      agent_outcome: ${{ steps.agent.outcome }}

    steps:
      # No App token in this job — only secrets an untrusted agent is allowed to see.
      # Reads use the default GITHUB_TOKEN (contents/issues/pull-requests: read above);
      # the write-capable App token is generated in, and never leaves, the `apply` job.
      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY;
            secret/data/products/connectors/ci/nexus USER | NEXUS_USER;
            secret/data/products/connectors/ci/nexus PASSWORD | NEXUS_PASSWORD;

      # Runs before the checkout on purpose: this decides *which* branch gets checked
      # out, so it has to be able to refuse before the repo is there.
      - name: Resolve and validate context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BACKPORT_PR: ${{ inputs.backport_pr }}
        run: |
          set -euo pipefail

          if [[ ! "${BACKPORT_PR}" =~ ^[0-9]+$ ]]; then
            echo "::error::backport_pr must be a PR number, got '${BACKPORT_PR}'"
            exit 1
          fi

          gh pr view "${BACKPORT_PR}" --repo "${REPO}" \
            --json number,state,isDraft,headRefName,baseRefName,author,url \
            > /tmp/backport-pr.json

          state=$(jq -r '.state' /tmp/backport-pr.json)
          draft=$(jq -r '.isDraft' /tmp/backport-pr.json)
          head=$(jq -r '.headRefName' /tmp/backport-pr.json)
          base=$(jq -r '.baseRefName' /tmp/backport-pr.json)
          author=$(jq -r '.author.login' /tmp/backport-pr.json)

          fail=0
          if [ "${state}" != "OPEN" ]; then
            echo "::error::#${BACKPORT_PR} is ${state}, not OPEN"
            fail=1
          fi
          if [ "${draft}" != "true" ]; then
            echo "::error::#${BACKPORT_PR} is not a draft — it either cherry-picked cleanly or has already been resolved"
            fail=1
          fi
          if [ "${author}" != "${BOT_LOGIN}" ]; then
            echo "::error::#${BACKPORT_PR} was opened by ${author}, not the backport bot (${BOT_LOGIN})"
            fail=1
          fi
          if [[ "${head}" =~ ^backport-([0-9]+)-to-(.+)$ ]]; then
            source_pr="${BASH_REMATCH[1]}"
          else
            echo "::error::head branch '${head}' is not a backport-<pr>-to-<target> branch"
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

          gh pr view "${source_pr}" --repo "${REPO}" \
            --json number,title,body,url,author,state,mergeCommit,commits \
            > /tmp/source-pr.json

          source_state=$(jq -r '.state' /tmp/source-pr.json)
          if [ "${source_state}" != "MERGED" ]; then
            echo "::error::head branch '${head}' points at #${source_pr}, but that PR is ${source_state}, not MERGED — refusing to treat it as this backport's source"
            exit 1
          fi

          # `--arg` is a jq option, not a `gh api` one — it can't follow `--jq` directly,
          # so pipe the paginated (concatenated) JSON into a real jq instead.
          gh api "repos/${REPO}/issues/${BACKPORT_PR}/comments" --paginate \
            | jq -r --arg bot "${BOT_LOGIN}" \
                '.[] | select(.user.login == $bot) | select(.body | test("cherry-pick the changes locally")) | .body' \
            > /tmp/conflict-instructions.txt

          if [ ! -s /tmp/conflict-instructions.txt ]; then
            source_commits=$(jq '.commits | length' /tmp/source-pr.json)
            if [ "${source_commits}" -gt 1 ]; then
              echo "::error::no cherry-pick instruction comment found on #${BACKPORT_PR}, and source PR #${source_pr} has ${source_commits} commits — cannot tell which shas to replay. Check whether korthout/backport-action reworded the comment this step filters on."
              exit 1
            fi
            echo "::warning::no cherry-pick instruction comment on #${BACKPORT_PR}; proceeding on merge_sha alone, since source PR #${source_pr} is a single commit"
          fi

          jq -n \
            --argjson backport_pr "$(cat /tmp/backport-pr.json)" \
            --argjson source_pr "$(cat /tmp/source-pr.json)" \
            --rawfile conflict_instructions /tmp/conflict-instructions.txt \
            '{backport_pr: $backport_pr, source_pr: $source_pr, conflict_instructions: $conflict_instructions}' \
            > /tmp/backport-context.json

          {
            echo "head=${head}"
            echo "base=${base}"
            echo "source_pr=${source_pr}"
            echo "source_author=$(jq -r '.author.login' /tmp/source-pr.json)"
            echo "merge_sha=$(jq -r '.mergeCommit.oid // ""' /tmp/source-pr.json)"
          } >> "$GITHUB_OUTPUT"

          echo "resolving #${BACKPORT_PR} (${head} -> ${base}) from source PR #${source_pr}"

      # persist-credentials: false so nothing checked out — the conflicted diff, PR body,
      # comments — sits next to a write-capable git credential. The agent runs over this
      # checkout with --dangerously-skip-permissions; this job never has a credential
      # that can write to GitHub in the first place, but keep the habit regardless.
      - name: Check out the backport branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.head }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Fetch the target branch and the source commit
        id: pre
        env:
          BASE: ${{ steps.ctx.outputs.base }}
          MERGE_SHA: ${{ steps.ctx.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE}"
          if [ -n "${MERGE_SHA}" ]; then
            git fetch origin "${MERGE_SHA}"
          fi
          # The tip as it stands before the agent touches anything. `apply` compares
          # the remote against this both to decide whether a resolution was pushed
          # and, again right before pushing, to make sure nothing else moved the
          # branch meanwhile. The checkout just fetched this branch, so local HEAD
          # is the remote tip.
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.9'

      - name: Update Maven settings.xml
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          servers: |
            [{
                "id": "camunda-nexus",
                "username": "${{ steps.secrets.outputs.NEXUS_USER }}",
                "password": "${{ steps.secrets.outputs.NEXUS_PASSWORD }}"
            }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      - name: Configure git
        run: |
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_LOGIN}@users.noreply.github.com"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.156
          claude --version

      - name: Fetch the agent manual
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/BACKPORT_RESOLVE_AGENT.md > /tmp/BACKPORT_RESOLVE_AGENT.md
          wc -l /tmp/BACKPORT_RESOLVE_AGENT.md

      # No GH_TOKEN here (there isn't one in this job at all): the agent gets
      # ANTHROPIC_API_KEY only, so it can run itself, but no credential that can write
      # to GitHub. It resolves and builds against the local checkout and leaves the
      # result as a local commit; it never pushes or calls `gh`.
      #
      # continue-on-error so a failing agent (bad resolution, failed build gate, tool
      # error) doesn't fail this job — `apply` still needs to run to comment on the
      # PR either way, gated on `agent_outcome` above rather than on this job's own
      # success.
      - name: Run the backport resolution agent
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Input for the agent is in /tmp/backport-context.json, written by the
          # validation step.
          claude -p "You are the Camunda connectors backport resolution agent. Read /tmp/BACKPORT_RESOLVE_AGENT.md in full. It is your operating manual: follow it exactly; do not skip it." \
            --dangerously-skip-permissions

      # Package whatever the agent left as a bundle rather than a diff, so the exact
      # commit (message, author, tree) survives the handoff — `apply` clones straight
      # from it. Gated on ctx+pre having passed, not just always(): a refusal in ctx
      # means no checkout, no branch to inspect, and a PR this workflow was never meant
      # to touch; a failure in pre means head_sha (PRE_SHA) was never recorded, so
      # there's no baseline to diff local HEAD against.
      - name: Package the result
        if: always() && steps.ctx.outcome == 'success' && steps.pre.outcome == 'success'
        env:
          PRE_SHA: ${{ steps.pre.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/resolution
          local_sha=$(git rev-parse HEAD)
          if [ "${local_sha}" != "${PRE_SHA}" ]; then
            git bundle create /tmp/resolution/resolution.bundle HEAD
          fi
          if [ -s /tmp/backport-notes.txt ]; then
            cp /tmp/backport-notes.txt /tmp/resolution/notes.txt
          fi

      - name: Upload the resolution artifact
        if: always() && steps.ctx.outcome == 'success' && steps.pre.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backport-resolution-${{ inputs.backport_pr }}
          path: /tmp/resolution
          if-no-files-found: warn
          retention-days: 1

  apply:
    name: Apply the outcome
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/common GITHUB_APP_ID;
            secret/data/products/connectors/ci/common GITHUB_APP_PRIVATE_KEY;
            secret/data/products/connectors/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY;
            secret/data/products/connectors/ci/nexus USER | NEXUS_USER;
            secret/data/products/connectors/ci/nexus PASSWORD | NEXUS_PASSWORD;

      # The only App token in this workflow, generated on a runner the agent never
      # touched, right before it's needed.
      - name: Generate a GitHub token for connectors
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.GITHUB_APP_ID }}
          private-key: ${{ steps.secrets.outputs.GITHUB_APP_PRIVATE_KEY }}

      - name: Download the resolution artifact
        uses: actions/download-artifact@v4
        with:
          name: backport-resolution-${{ inputs.backport_pr }}
          path: /tmp/resolution

      # A plain, fresh checkout of the branch as it stands right now — nothing to do
      # with the `resolve` job's checkout, which the agent had unrestricted shell
      # access to and which never leaves that job.
      - name: Check out the backport branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Apply the outcome
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BACKPORT_PR: ${{ inputs.backport_pr }}
          HEAD: ${{ needs.resolve.outputs.head }}
          PRE_SHA: ${{ needs.resolve.outputs.pre_sha }}
          SOURCE_AUTHOR: ${{ needs.resolve.outputs.source_author }}
          AGENT_OUTCOME: ${{ needs.resolve.outputs.agent_outcome }}
          ANTHROPIC_API_KEY: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
          NEXUS_USER: ${{ steps.secrets.outputs.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ steps.secrets.outputs.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          comment() {
            gh pr comment "${BACKPORT_PR}" --repo "${REPO}" --body "$1"
          }

          # The agent fully controlled notes.txt's content. Redact any of the secrets
          # it had filesystem access to (but no env access to push with) before this
          # step publishes it verbatim to a PR comment — otherwise a prompt-injected
          # agent could exfiltrate them through the comment itself, no network egress
          # needed.
          redact() {
            local text="$1" secret="$2"
            if [ -n "${secret}" ]; then
              text=$(printf '%s' "${text}" | sed "s/$(printf '%s' "${secret}" | sed 's/[.[\*^$()+?{|\\\/&]/\\&/g')/[redacted]/g")
            fi
            printf '%s' "${text}"
          }

          notes="_The agent left no notes._"
          if [ -s /tmp/resolution/notes.txt ]; then
            notes=$(cat /tmp/resolution/notes.txt)
          fi
          notes=$(redact "${notes}" "${ANTHROPIC_API_KEY}")
          notes=$(redact "${notes}" "${NEXUS_USER}")
          notes=$(redact "${notes}" "${NEXUS_PASSWORD}")

          # This checkout is fresh, so HEAD here is the branch's current remote tip —
          # re-check it against PRE_SHA in case something else pushed while `resolve`
          # was running, rather than trusting the value `resolve` captured earlier.
          current_sha=$(git rev-parse HEAD)
          if [ "${current_sha}" != "${PRE_SHA}" ]; then
            echo "::error::${HEAD} moved from ${PRE_SHA} to ${current_sha} while resolving; discarding the agent's resolution rather than overwriting that change"
            comment ":warning: Someone else pushed to this branch while the resolution agent was working, so its result was discarded to avoid overwriting that push. Re-run the resolver if it's still needed. [Run](${run_url})"
            exit 0
          fi

          if [ "${AGENT_OUTCOME}" != "success" ] || [ ! -f /tmp/resolution/resolution.bundle ]; then
            comment ":warning: The backport resolution agent left this unchanged (agent step: \`${AGENT_OUTCOME}\`), so this PR stays a draft. Resolve it locally with the instructions above. ${notes} [Run](${run_url})"
            exit 0
          fi

          git fetch --quiet /tmp/resolution/resolution.bundle HEAD:refs/resolution/head
          local_sha=$(git rev-parse refs/resolution/head)

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" \
            push --no-verify --force-with-lease="refs/heads/${HEAD}:${PRE_SHA}" \
            "https://github.com/${REPO}.git" "${local_sha}:refs/heads/${HEAD}"

          gh pr ready "${BACKPORT_PR}" --repo "${REPO}"
          comment ":robot: Conflict resolved by the backport resolution agent — a machine merge, so please read the diff rather than only the checks. ${notes} [Run](${run_url})"
