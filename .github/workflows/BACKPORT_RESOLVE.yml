name: Resolve backport conflicts
run-name: Resolve backport conflicts

# Dispatched by BACKPORT_PR.yml for every backport PR the action opened as a draft,
# i.e. every one whose cherry-pick hit a conflict and had that conflict committed.
# Runs the Claude Code CLI over the checkout, replays the cherry-pick cleanly, and
# force-pushes the resolution only if it builds.

on:
  workflow_dispatch:
    inputs:
      backport_pr:
        description: >
          Number of the draft backport PR to resolve.
        required: true
        type: string

# Everything this workflow writes goes through the App token, not the workflow token, as App token will trigger CI.
permissions:
  contents: read

concurrency:
  group: backport-resolve-${{ inputs.backport_pr }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Import Vault secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/common GITHUB_APP_ID;
            secret/data/products/connectors/ci/common GITHUB_APP_PRIVATE_KEY;
            secret/data/products/connectors/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY;
            secret/data/products/connectors/ci/nexus USER | NEXUS_USER;
            secret/data/products/connectors/ci/nexus PASSWORD | NEXUS_PASSWORD;

      - name: Generate a GitHub token for connectors
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.GITHUB_APP_ID }}
          private-key: ${{ steps.secrets.outputs.GITHUB_APP_PRIVATE_KEY }}

      # Only the backport bot itself is allowed to author the PR this workflow acts on
      # (see the author check below): every write this job makes goes through this same
      # App token, and korthout/backport-action always opens the backport PR with it too.
      - name: Determine the backport bot's login
        id: bot
        run: echo "login=${{ steps.app-token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"

      # Runs before the checkout on purpose: this decides *which* branch gets checked
      # out and force-pushed, so it has to be able to refuse before the repo is there.
      - name: Resolve and validate context
        id: ctx
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BACKPORT_PR: ${{ inputs.backport_pr }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
        run: |
          set -euo pipefail

          if [[ ! "${BACKPORT_PR}" =~ ^[0-9]+$ ]]; then
            echo "::error::backport_pr must be a PR number, got '${BACKPORT_PR}'"
            exit 1
          fi

          gh pr view "${BACKPORT_PR}" --repo "${REPO}" \
            --json number,state,isDraft,headRefName,baseRefName,author,url \
            > /tmp/backport-pr.json

          state=$(jq -r '.state' /tmp/backport-pr.json)
          draft=$(jq -r '.isDraft' /tmp/backport-pr.json)
          head=$(jq -r '.headRefName' /tmp/backport-pr.json)
          base=$(jq -r '.baseRefName' /tmp/backport-pr.json)
          author=$(jq -r '.author.login' /tmp/backport-pr.json)

          fail=0
          if [ "${state}" != "OPEN" ]; then
            echo "::error::#${BACKPORT_PR} is ${state}, not OPEN"
            fail=1
          fi
          if [ "${draft}" != "true" ]; then
            echo "::error::#${BACKPORT_PR} is not a draft — it either cherry-picked cleanly or has already been resolved"
            fail=1
          fi
          if [ "${author}" != "${BOT_LOGIN}" ]; then
            echo "::error::#${BACKPORT_PR} was opened by ${author}, not the backport bot (${BOT_LOGIN})"
            fail=1
          fi
          if [[ "${head}" =~ ^backport-([0-9]+)-to-(.+)$ ]]; then
            source_pr="${BASH_REMATCH[1]}"
          else
            echo "::error::head branch '${head}' is not a backport-<pr>-to-<target> branch"
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

          gh pr view "${source_pr}" --repo "${REPO}" \
            --json number,title,body,url,author,state,mergeCommit,commits \
            > /tmp/source-pr.json

          source_state=$(jq -r '.state' /tmp/source-pr.json)
          if [ "${source_state}" != "MERGED" ]; then
            echo "::error::head branch '${head}' points at #${source_pr}, but that PR is ${source_state}, not MERGED — refusing to treat it as this backport's source"
            exit 1
          fi

          # `--arg` is a jq option, not a `gh api` one — it can't follow `--jq` directly,
          # so pipe the paginated (concatenated) JSON into a real jq instead.
          gh api "repos/${REPO}/issues/${BACKPORT_PR}/comments" --paginate \
            | jq -r --arg bot "${BOT_LOGIN}" \
                '.[] | select(.user.login == $bot) | select(.body | test("cherry-pick the changes locally")) | .body' \
            > /tmp/conflict-instructions.txt

          if [ ! -s /tmp/conflict-instructions.txt ]; then
            source_commits=$(jq '.commits | length' /tmp/source-pr.json)
            if [ "${source_commits}" -gt 1 ]; then
              echo "::error::no cherry-pick instruction comment found on #${BACKPORT_PR}, and source PR #${source_pr} has ${source_commits} commits — cannot tell which shas to replay. Check whether korthout/backport-action reworded the comment this step filters on."
              exit 1
            fi
            echo "::warning::no cherry-pick instruction comment on #${BACKPORT_PR}; proceeding on merge_sha alone, since source PR #${source_pr} is a single commit"
          fi

          jq -n \
            --argjson backport_pr "$(cat /tmp/backport-pr.json)" \
            --argjson source_pr "$(cat /tmp/source-pr.json)" \
            --rawfile conflict_instructions /tmp/conflict-instructions.txt \
            '{backport_pr: $backport_pr, source_pr: $source_pr, conflict_instructions: $conflict_instructions}' \
            > /tmp/backport-context.json

          {
            echo "head=${head}"
            echo "base=${base}"
            echo "source_pr=${source_pr}"
            echo "source_author=$(jq -r '.author.login' /tmp/source-pr.json)"
            echo "merge_sha=$(jq -r '.mergeCommit.oid // ""' /tmp/source-pr.json)"
          } >> "$GITHUB_OUTPUT"

          echo "resolving #${BACKPORT_PR} (${head} -> ${base}) from source PR #${source_pr}"

      # persist-credentials: false so nothing checked out — the conflicted diff, PR body,
      # comments — sits next to a write-capable git credential. The agent runs over this
      # checkout with --dangerously-skip-permissions; keep the push credential out of its
      # reach entirely rather than trust it not to be prompt-injected into using one.
      - name: Check out the backport branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.head }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Fetch the target branch and the source commit
        id: pre
        env:
          BASE: ${{ steps.ctx.outputs.base }}
          MERGE_SHA: ${{ steps.ctx.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE}"
          if [ -n "${MERGE_SHA}" ]; then
            git fetch origin "${MERGE_SHA}"
          fi
          # The tip as it stands before the agent touches anything. The outcome step
          # compares the remote against this to decide whether a resolution was pushed,
          # rather than asking the agent whether it succeeded. The checkout just fetched
          # this branch, so local HEAD is the remote tip.
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.9'

      - name: Update Maven settings.xml
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          servers: |
            [{
                "id": "camunda-nexus",
                "username": "${{ steps.secrets.outputs.NEXUS_USER }}",
                "password": "${{ steps.secrets.outputs.NEXUS_PASSWORD }}"
            }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      - name: Configure git
        run: |
          git config user.name "team-connectors-int-automation[bot]"
          git config user.email "team-connectors-int-automation[bot]@users.noreply.github.com"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.156
          claude --version

      - name: Fetch the agent manual
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/BACKPORT_RESOLVE_AGENT.md > /tmp/BACKPORT_RESOLVE_AGENT.md
          wc -l /tmp/BACKPORT_RESOLVE_AGENT.md

      # No GH_TOKEN here: the agent gets ANTHROPIC_API_KEY only, so it can run itself, but
      # no credential that can write to GitHub. It resolves and builds against the local
      # checkout and leaves the result as a local commit; it never pushes or calls `gh`.
      - name: Run the backport resolution agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Input for the agent is in /tmp/backport-context.json, written by the
          # validation step.
          claude -p "You are the Camunda connectors backport resolution agent. Read /tmp/BACKPORT_RESOLVE_AGENT.md in full. It is your operating manual: follow it exactly; do not skip it." \
            --dangerously-skip-permissions

      # Gated on validation and the pre-agent fetch having passed, not just always():
      # a refusal in ctx means no checkout, no branch to inspect, and a PR this workflow
      # was never meant to touch; a failure in pre means head_sha was never recorded, so
      # there's no baseline to diff local HEAD against and no way to tell a real agent
      # resolution from an unrelated one. Both fail with their own error and this step
      # stays out of it, leaving the PR as a draft.
      #
      # This is also the first step with a write-capable credential since the agent ran,
      # and the only one that pushes — the agent leaves its resolution as a local commit,
      # never touching origin itself.
      - name: Apply the outcome
        if: always() && steps.ctx.outcome == 'success' && steps.pre.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BACKPORT_PR: ${{ inputs.backport_pr }}
          HEAD: ${{ steps.ctx.outputs.head }}
          PRE_SHA: ${{ steps.pre.outputs.head_sha }}
          SOURCE_AUTHOR: ${{ steps.ctx.outputs.source_author }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          ANTHROPIC_API_KEY: ${{ steps.secrets.outputs.ANTHROPIC_API_KEY }}
          NEXUS_USER: ${{ steps.secrets.outputs.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ steps.secrets.outputs.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          comment() {
            gh pr comment "${BACKPORT_PR}" --repo "${REPO}" --body "$1"
          }

          # The agent fully controls this file's content. Redact any of the secrets it
          # had filesystem access to (but no env access to push with) before this trusted
          # step publishes it verbatim to a PR comment — otherwise a prompt-injected agent
          # could exfiltrate them through the comment itself, with no network egress needed.
          redact() {
            local text="$1" secret="$2"
            if [ -n "${secret}" ]; then
              text=$(printf '%s' "${text}" | sed "s/$(printf '%s' "${secret}" | sed 's/[.[\*^$()+?{|\\\/&]/\\&/g')/[redacted]/g")
            fi
            printf '%s' "${text}"
          }

          notes="_The agent left no notes._"
          if [ -s /tmp/backport-notes.txt ]; then
            notes=$(cat /tmp/backport-notes.txt)
          fi
          notes=$(redact "${notes}" "${ANTHROPIC_API_KEY}")
          notes=$(redact "${notes}" "${NEXUS_USER}")
          notes=$(redact "${notes}" "${NEXUS_PASSWORD}")

          local_sha=$(git rev-parse HEAD)
          if [ "${local_sha}" = "${PRE_SHA}" ]; then
            comment ":warning: The backport resolution agent left this unchanged (agent step: \`${AGENT_OUTCOME}\`), so this PR stays a draft. Resolve it locally with the instructions above. ${notes} [Run](${run_url})"
            exit 0
          fi

          # Push from a pristine, agent-untouched clone with an isolated git environment:
          # the working tree's local config (aliases like `push`, `url.*.insteadOf`, hooks)
          # and the runner's own global/system git config are all reachable by the agent's
          # unrestricted shell, and `git push` anywhere under this HOME honors all of it
          # regardless of the URL/refspec given — so push from neither. The lease is pinned
          # to PRE_SHA, captured before the agent ran, rather than a local remote-tracking
          # ref the agent could have forged with `git fetch`/`update-ref`.
          fresh_dir=$(mktemp -d)
          git init --quiet "${fresh_dir}"
          GIT_CONFIG_NOSYSTEM=1 HOME="${fresh_dir}" git -C "${fresh_dir}" \
            fetch --quiet "${GITHUB_WORKSPACE}" "${local_sha}"
          GIT_CONFIG_NOSYSTEM=1 HOME="${fresh_dir}" git -C "${fresh_dir}" \
            -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" \
            push --no-verify --force-with-lease="refs/heads/${HEAD}:${PRE_SHA}" \
            "https://github.com/${REPO}.git" "${local_sha}:refs/heads/${HEAD}"
          rm -rf "${fresh_dir}"

          gh pr ready "${BACKPORT_PR}" --repo "${REPO}"
          comment ":robot: Conflict resolved by the backport resolution agent — a machine merge, so please read the diff rather than only the checks. ${notes} [Run](${run_url})"
