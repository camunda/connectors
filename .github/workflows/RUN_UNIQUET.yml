name: Run uniquet and push
on:
  workflow_dispatch:

jobs:
  run-uniquet-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.13+9.0.LTS'
          distribution: 'temurin'

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch_name }}

      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - name: install-uniquet
        run: |
          ./mvnw -U install -DskipTests -pl element-template-generator/uniquet -am

      - name: run-uniquet
        run: |
          ./element-template-generator/uniquet/target/appassembler/bin/uniquet --output-file ./connector-templates.json  --ignore-file ./ignore-templates.json

      - name: Create pull request to main branch
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: single-file-element-template
          commit-message: "others(element-template): single element template file"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          title: "others(element-template): single element template file generation"
          labels: "no milestone"
          body: |
            This PR sets the new single element template file containing all necessary references.

      - name: Submit build status
        if: always()
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}
