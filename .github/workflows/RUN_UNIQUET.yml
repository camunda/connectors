name: Run uniquet and push
on:
  workflow_dispatch:

jobs:
  run-uniquet-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '25.0.4+101.0.LTS'
          distribution: 'temurin'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch_name }}

      - name: install-uniquet
        run: |
          ./mvnw -U install -DskipTests -pl element-template-generator/uniquet -am

      - name: run-uniquet
        run: |
          ./element-template-generator/uniquet/target/appassembler/bin/uniquet --output-file ./connector-templates.json  --ignore-file ./ignore-templates.json

      - name: Create pull request to main branch
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: single-file-element-template
          commit-message: "other(element-template): single element template file"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          title: "other(element-template): single element template file generation"
          body: |
            This PR sets the new single element template file containing all necessary references.
