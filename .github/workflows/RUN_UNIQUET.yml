name: Run uniquet and push
on:
  workflow_dispatch:

jobs:
  run-uniquet-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25.0.5+100000002.0.LTS'
          distribution: 'temurin'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch_name }}

      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - name: install-uniquet
        run: |
          ./mvnw -U install -DskipTests -pl element-template-generator/uniquet -am

      - name: run-uniquet
        run: |
          ./element-template-generator/uniquet/target/appassembler/bin/uniquet --output-file ./connector-templates.json  --ignore-file ./ignore-templates.json

      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: ${{ secrets.VAULT_JWT_ROLE }}
          path: ${{ secrets.VAULT_JWT_PATH }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/connectors/ci/common GITHUB_APP_ID;
            secret/data/products/connectors/ci/common GITHUB_APP_PRIVATE_KEY;

      - name: Generate a GitHub token for connectors
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ steps.vault-secrets.outputs.GITHUB_APP_ID }}
          private-key: ${{ steps.vault-secrets.outputs.GITHUB_APP_PRIVATE_KEY }}

      # A PR created with GITHUB_TOKEN triggers no workflow, so its required checks
      # never run. The app token also lets AUTO_MERGE_AUTOMATION_PR.yml merge it.
      - name: Create pull request to main branch
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: single-file-element-template
          commit-message: "other(element-template): single element template file"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          title: "other(element-template): single element template file generation"
          body: |
            This PR sets the new single element template file containing all necessary references.

      - name: Submit build status
        if: always()
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}
