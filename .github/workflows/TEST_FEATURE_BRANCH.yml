name: Test branch

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-readonly-queue/**'
  merge_group:
    branches: [ main, 'stable/**' ]

jobs:
  run-tests:
    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Maven command
        id: resolve-maven
        run: |
          if [ -x ./mvnw ]; then
            echo "has-wrapper=true" >> "$GITHUB_OUTPUT"
            echo "MVN_CMD=./mvnw" >> "$GITHUB_ENV"
          else
            echo "has-wrapper=false" >> "$GITHUB_OUTPUT"
            echo "MVN_CMD=mvn" >> "$GITHUB_ENV"
          fi

      - name: Install Maven (wrapper-less branches)
        if: steps.resolve-maven.outputs.has-wrapper != 'true'
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.0

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;
            secret/data/products/connectors/ci/common REGISTRY_MINIMUS_PSW;

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.12+101.0.LTS'

      # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@v3.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

