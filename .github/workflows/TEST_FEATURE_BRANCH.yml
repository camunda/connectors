name: Test branch

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Feature branches are covered by pull_request; running on push too would
  # test every PR commit twice. Push only covers long-lived branches.
  push:
    branches:
      - 'stable/**'
      - 'alpha/**'
      - 'release-*'
  merge_group:
    branches: [ main, 'stable/**' ]

# Cancel stale runs of the same type (push-on-push, PR-on-PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:

    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Determine internal build:
      # Internal if repository owner is camunda AND (not a PR from a fork).
      # For pull_request: !github.event.pull_request.head.repo.fork
      # For push/merge_group: repository is always base repo if owner matches.
      # We avoid using secrets for fork pushes because this workflow file exists only in base repo; fork pushes wouldn't have camunda owner.
      - name: Set internal build flag
        id: internal
        run: |
          if [ "${{ github.repository_owner }}" = "camunda" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
                echo "internal=true" >> $GITHUB_OUTPUT
              else
                echo "internal=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "internal=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      # Restore cache (distinct key for internal vs external to avoid mixing artifacts)
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ steps.internal.outputs.internal == 'true' && 'internal' || 'external' }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)

      # Internal-only: fetch Nexus credentials from Vault and create settings.xml with mirror
      - name: Import Nexus Secrets (internal only)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_USR;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC;

      - name: Create internal Maven settings.xml (Nexus mirror)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.ARTIFACTORY_USR }}",
               "password": "${{ steps.secrets.outputs.ARTIFACTORY_PSW }}"
             },
            {
               "id": "central",
               "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}",
               "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"
             }
            ]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      # Build, test and check Javadoc (format runs in a parallel job)
      # Javadoc runs in the same invocation so it reuses the compiled reactor.
      - name: Build Connectors
        run: ./mvnw --batch-mode -U clean test javadoc:javadoc-no-fork -Dquickly -T 1C '-P!autoFormat'

      - name: Publish Test Report
        if: always() && steps.internal.outputs.internal == 'true'
        uses: scacap/action-surefire-report@v1
        with:
          check_name: 'Publish Test Report'

      - name: Upload detailed surefire reports
        if: always() && steps.internal.outputs.internal == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Lint Dockerfile - connector-runtime
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: connector-runtime/connector-runtime-application/Dockerfile

      - name: Lint Dockerfile - SaaS
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: bundle/camunda-saas-bundle/Dockerfile

      - name: Lint Dockerfile - default-bundle
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: bundle/default-bundle/Dockerfile

      - name: Check element templates for forbidden links to /next/ documentation
        run: |
          chmod +x ./.github/workflows/scripts/collect_all_element_template_docs_links.sh
          ./.github/workflows/scripts/collect_all_element_template_docs_links.sh --current-only
          if grep -q "/next/" connectors-element-template-links.txt; then
            echo "❌ Forbidden link to '/next/' documentation found!"
            exit 1
          fi
        shell: bash

  check-format:

    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set internal build flag
        id: internal
        run: |
          if [ "${{ github.repository_owner }}" = "camunda" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
                echo "internal=true" >> $GITHUB_OUTPUT
              else
                echo "internal=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "internal=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ steps.internal.outputs.internal == 'true' && 'internal' || 'external' }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: Import Nexus Secrets (internal only)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_USR;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC;

      - name: Create internal Maven settings.xml (Nexus mirror)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.ARTIFACTORY_USR }}",
               "password": "${{ steps.secrets.outputs.ARTIFACTORY_PSW }}"
             },
            {
               "id": "central",
               "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}",
               "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"
             }
            ]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      # Invoke the goals directly instead of `validate -PcheckFormat`: running a
      # lifecycle phase makes Maven resolve every build plugin, so the
      # reactor-built element-template-generator plugin would have to be installed first.
      - name: Check Format
        run: ./mvnw --batch-mode -T 1C spotless:check com.mycila:license-maven-plugin:check
