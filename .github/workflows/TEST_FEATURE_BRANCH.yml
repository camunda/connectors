name: Test branch

on:
  pull_request_target:
    branches:
      - 'main'
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-readonly-queue/**'
  merge_group:
    branches: [ main, 'stable/**' ]

# Cancel stale runs of the same type (push-on-push, PR-on-PR) without
# letting push and pull_request events cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@v4

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: internal
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=8.7
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      # Restore-only: the cache is written from main by WARM_MAVEN_CACHE.yml so that
      # per-PR saves don't evict it. Keep the key in sync with that workflow.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@v3.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)

      # Build and test (format check runs in a parallel job)
      - name: Build Connectors
        run: ./mvnw --batch-mode clean test -Dquickly -T 1C '-P!autoFormat'

      - name: Publish Test Report
        if: success() || failure()
        uses: scacap/action-surefire-report@v1

      - name: Upload detailed surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Lint Dockerfile - connector-runtime
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: connector-runtime/connector-runtime-application/Dockerfile

      - name: Lint Dockerfile - SaaS
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: bundle/camunda-saas-bundle/Dockerfile

      - name: Lint Dockerfile - default-bundle
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: bundle/default-bundle/Dockerfile

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  check-format:
    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@v4

      - name: Import Secrets
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/common ARTIFACTORY_USR | CI_LDAP_USER;
            secret/data/products/connectors/ci/common ARTIFACTORY_PSW | CI_LDAP_PASSWORD;

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: internal
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=8.7
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      # Restore-only: the cache is written from main by WARM_MAVEN_CACHE.yml so that
      # per-PR saves don't evict it. Keep the key in sync with that workflow.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Cache Maven wrapper distribution
        uses: ./.github/actions/cache-maven-wrapper

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@v3.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_LDAP_USER }}",
               "password": "${{ steps.secrets.outputs.CI_LDAP_PASSWORD }}"
             }]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!shibboleth,!confluent", "name": "camunda Nexus"}]'

      # Invoke the goals directly instead of `validate -PcheckFormat`: running a
      # lifecycle phase makes Maven resolve every build plugin, so the
      # reactor-built element-template-generator plugin would have to be installed first.
      - name: Check Format
        run: ./mvnw --batch-mode -T 1C spotless:check com.mycila:license-maven-plugin:check

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}
