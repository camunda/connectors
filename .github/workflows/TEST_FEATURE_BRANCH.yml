name: Test branch

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Feature branches are covered by pull_request (and merge_group for main);
  # running on push too would test every PR commit twice. Push only covers
  # long-lived branches whose merges are not tested by merge_group.
  push:
    branches:
      - 'stable/**'
      - 'alpha/**'
      - 'release-*'
  merge_group:
    branches: [ main ]

permissions:
  contents: read
  checks: write

# Cancel stale runs of the same type (push-on-push, PR-on-PR). Merge-queue runs
# are keyed on the merge group's head ref so entries queued behind others
# don't collide into the same group and get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:

    runs-on: ${{ github.repository_owner == 'camunda' && !startsWith(github.event.pull_request.head.ref || github.ref_name, 'fix/alwaysgreen-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      # Determine internal build:
      # Internal if the repository owner is camunda, the branch is not generated by
      # AlwaysGreen, and the PR is not from a fork.
      # For pull_request: !github.event.pull_request.head.repo.fork
      # For push/merge_group: repository is always base repo if owner matches.
      # We avoid using secrets for fork pushes because this workflow file exists only in base repo; fork pushes wouldn't have camunda owner.
      - name: Set internal build flag
        id: internal
        env:
          IS_ALWAYSGREEN_BRANCH: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'fix/alwaysgreen-') }}
        run: |
          if [ "${IS_ALWAYSGREEN_BRANCH}" = "true" ]; then
            echo "internal=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.repository_owner }}" = "camunda" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
                echo "internal=true" >> $GITHUB_OUTPUT
              else
                echo "internal=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "internal=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: ${{ steps.internal.outputs.internal == 'true' && 'internal' || 'external' }}
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=main
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      # Restore-only: the cache is written from main by WARM_MAVEN_CACHE.yml so that
      # per-PR saves don't evict it. Keep the key in sync with that workflow.
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Restore Maven wrapper cache
        uses: ./.github/actions/cache-maven-wrapper
        with:
          restore-only: 'true'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5+8.0.LTS'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install element templates CLI
        run: npm install --global element-templates-cli@$(jq -r '.devDependencies["element-templates-cli"]' .github/workflows/package.json)

      # Internal-only: fetch Nexus credentials from Vault and create settings.xml with mirror
      - name: Import Nexus Secrets (internal only)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false # we rely on step outputs, no need for environment variables
          secrets: |
            secret/data/products/connectors/ci/nexus USER | CI_NEXUS_USR;
            secret/data/products/connectors/ci/nexus PASSWORD | CI_NEXUS_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_USR;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC;

      - name: Create internal Maven settings.xml (Nexus mirror)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_NEXUS_USR }}",
               "password": "${{ steps.secrets.outputs.CI_NEXUS_PSW }}"
             },
            {
               "id": "central",
               "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}",
               "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"
             }
            ]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      # Build, test and check Javadoc (format runs in a parallel job)
      # The build regenerates all element template JSON files as part of
      # the `process-classes` phase (element-template-generator-maven-plugin),
      # writing them back into each connector's element-templates/ source dir.
      # Javadoc runs in the same invocation so it reuses the compiled reactor.
      - name: Build Connectors
        run: ./mvnw --batch-mode -U clean test javadoc:javadoc-no-fork -Dquickly -T 1C '-P!autoFormat'

      # The build above stops at `test`; the revapi check is bound to `verify`.
      # Keep the module list in sync with the API-gated modules in docs/api-compatibility.md.
      - name: Check API compatibility
        run: ./mvnw --batch-mode -pl connector-sdk/core,connectors/agentic-ai/aiagent-model,connectors/agentic-ai/aiagent-api -am verify -DskipTests -Dquickly '-P!autoFormat'

      - name: Check accepted API breaks are justified
        run: |
          python3 ./.github/workflows/scripts/test_check_api_changes.py
          python3 ./.github/workflows/scripts/check_api_changes.py

      # Fail if the regenerated templates differ from what's committed. This is a
      # diff check only — CI never commits or modifies files. Versioned snapshots
      # (element-templates/versioned/) are intentionally excluded, as they are
      # pinned and not overwritten on regeneration.
      - name: Verify element templates are in sync with Java source
        run: |
          set -euo pipefail
          # Directory-anchored pathspecs: root templates and hybrid/ variants,
          # excluding pinned versioned/ snapshots.
          PATHSPEC=(
            '*/element-templates/*.json'
            '*/element-templates/hybrid/*.json'
            ':(exclude)*/element-templates/versioned/*'
          )
          # Register intent-to-add for any brand-new (untracked) generated
          # templates so a single `git diff` reports — with content — both
          # modified and newly created files. This stages no file content.
          git add -N -- "${PATHSPEC[@]}"
          if git diff --quiet -- "${PATHSPEC[@]}"; then
            echo "✅ All element templates match their Java source."
          else
            echo "❌ Element templates are out of sync with their Java source."
            echo "   Run 'mvn install' (or 'mvn process-classes') locally and commit the regenerated templates."
            echo ""
            git diff --stat -- "${PATHSPEC[@]}"
            echo ""
            git diff -- "${PATHSPEC[@]}"
            exit 1
          fi

      - name: Publish Test Report
        if: always()
        uses: ScalableCapital/action-surefire-report@v2
        with:
          check_name: 'Publish Test Report'
          report_mode: ${{ steps.internal.outputs.internal == 'true' && 'check-run' || 'workflow' }}

      - name: Upload detailed surefire reports
        if: always() && steps.internal.outputs.internal == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Lint Dockerfile - connector-runtime
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/connector-runtime-application/Dockerfile

      - name: Lint Dockerfile - SaaS
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/bundle/camunda-saas-bundle/Dockerfile

      - name: Lint Dockerfile - default-bundle
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/bundle/default-bundle/Dockerfile

      - name: Check Java sources for unversioned or /next/ documentation links
        run: ./.github/workflows/scripts/check_java_docs_links.sh
        shell: bash

      - name: Validate element templates
        run: |
          ./mvnw --batch-mode -pl element-template-generator/validator -am package -DskipTests
          ./element-template-generator/validator/target/appassembler/bin/element-template-validator

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  check-format:

    runs-on: ${{ github.repository_owner == 'camunda' && !startsWith(github.event.pull_request.head.ref || github.ref_name, 'fix/alwaysgreen-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Set internal build flag
        id: internal
        env:
          IS_ALWAYSGREEN_BRANCH: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'fix/alwaysgreen-') }}
        run: |
          if [ "${IS_ALWAYSGREEN_BRANCH}" = "true" ]; then
            echo "internal=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.repository_owner }}" = "camunda" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if [ "${{ github.event.pull_request.head.repo.fork }}" = "false" ]; then
                echo "internal=true" >> $GITHUB_OUTPUT
              else
                echo "internal=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "internal=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      # Inlined rather than using .github/actions/maven-cache-key: this job checks out the
      # PR head, which may predate that action. Keep the line derivation in sync with it.
      - name: Compute Maven cache key
        id: maven-cache-key
        env:
          REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}
          SUFFIX: ${{ steps.internal.outputs.internal == 'true' && 'internal' || 'external' }}
          HASH: ${{ hashFiles('**/pom.xml') }}
        run: |
          ref="${REF#refs/heads/}"
          if [[ "$ref" =~ ^(stable/|release-)?([0-9]+\.[0-9]+) ]]; then
            line="${BASH_REMATCH[2]}"
          else
            line=main
          fi
          prefix="${RUNNER_OS}-maven-${line}-"
          echo "restore-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${HASH}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-cache-key.outputs.restore-prefix }}

      # Kept separate from ~/.m2/repository: changing that entry's paths would invalidate it.
      - name: Restore Maven wrapper cache
        uses: ./.github/actions/cache-maven-wrapper
        with:
          restore-only: 'true'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5+8.0.LTS'

      - name: Import Nexus Secrets (internal only)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/nexus USER | CI_NEXUS_USR;
            secret/data/products/connectors/ci/nexus PASSWORD | CI_NEXUS_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_USR;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_DEPLOYMENT_PSW;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_PASSPHRASE;
            secret/data/github.com/organizations/camunda MAVEN_CENTRAL_GPG_SIGNING_KEY_SEC;

      - name: Create internal Maven settings.xml (Nexus mirror)
        if: ${{ steps.internal.outputs.internal == 'true' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: |
            [{
               "id": "camunda-nexus",
               "username": "${{ steps.secrets.outputs.CI_NEXUS_USR }}",
               "password": "${{ steps.secrets.outputs.CI_NEXUS_PSW }}"
             },
            {
               "id": "central",
               "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}",
               "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"
             }
            ]
          mirrors: '[{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!confluent,!shibboleth", "name": "camunda Nexus"}]'

      # Invoke the goals directly instead of `validate -PcheckFormat`: running a
      # lifecycle phase makes Maven resolve every build plugin, so the
      # reactor-built element-template-generator plugin would have to be installed first.
      - name: Check Format
        run: ./mvnw --batch-mode -T 1C spotless:check com.mycila:license-maven-plugin:check

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}

  check-versioned-element-templates:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          # Full history so the merge-base with origin/main can be resolved for
          # the three-dot diff used to find newly added versioned templates.
          fetch-depth: 0

      - name: Fetch main ref
        run: git fetch origin main --quiet
        shell: bash

      - name: Check versioned element templates match main
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          chmod +x ./.github/workflows/scripts/check_versioned_element_templates.sh
          ./.github/workflows/scripts/check_versioned_element_templates.sh
        shell: bash

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}
