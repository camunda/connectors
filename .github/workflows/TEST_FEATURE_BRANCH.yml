name: Test branch

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-readonly-queue/**'
  merge_group:
    branches: [ main, 'stable/**' ]

# Cancel stale runs of the same type (push-on-push, PR-on-PR) without
# letting push and pull_request events cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:

    runs-on: ${{ github.repository_owner == 'camunda' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'gcp-core-8-default' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

