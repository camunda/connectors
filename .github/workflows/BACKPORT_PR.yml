name: Backport merged pull request
on:
  pull_request_target:
    types: [ closed ]
  issue_comment:
    types: [ created ]

permissions:
  contents: write # so it can comment
  pull-requests: write # so it can create pull requests
  actions: write # so it can dispatch BACKPORT_RESOLVE.yml for a conflicted backport

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest

    # Only run when pull request is merged
    # or when a comment containing `/backport` is created by someone other than the
    # https://github.com/backport-action bot user (user id: 97796249)
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 97796249 &&
        startsWith(github.event.comment.body, '/backport')
      )
    steps:
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID}}
          secrets: |
            secret/data/products/connectors/ci/common GITHUB_APP_ID;
            secret/data/products/connectors/ci/common GITHUB_APP_PRIVATE_KEY;
      - name: Generate a GitHub token for connectors
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.vault-secrets.outputs.GITHUB_APP_ID }}
          private-key: ${{ steps.vault-secrets.outputs.GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # PR created by GitHub Action bot will not trigger CI checks
          token: ${{ steps.app-token.outputs.token }}
      - name: Create backport pull requests
        id: backport
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          experimental: >
            {
              "detect_merge_method": true,
              "conflict_resolution": "draft_commit_conflicts"
            }
      - name: Dispatch the resolver for conflicted backports
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CREATED: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          set -euo pipefail
          for pr in ${CREATED}; do
            if [ "$(gh pr view "$pr" --repo "$REPO" --json isDraft -q .isDraft)" != "true" ]; then
              echo "#$pr cherry-picked cleanly, nothing to resolve"
              continue
            fi
            echo "#$pr has committed conflicts, dispatching the resolver"
            gh workflow run BACKPORT_RESOLVE.yml --repo "$REPO" -f backport_pr="$pr"
          done