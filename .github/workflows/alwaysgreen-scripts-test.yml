# description: Unit tests for the AlwaysGreen classifier and dispatch planner. They are
# pure functions with no network and no cluster, so they run in seconds — but nothing
# else in CI executes them, and a silent break there means mis-triaged failures or
# duplicate fix PRs rather than a red build.
# type: CI
# owner: @camunda/test-automation-team
---
name: AlwaysGreen scripts test

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/alwaysgreen/**'
      - '.github/workflows/alwaysgreen-fix.yml'
      - '.github/workflows/BUILD_PR_DOCKER_IMAGES.yml'
      - '.github/workflows/CHECK_LICENSES.yml'
      - '.github/workflows/NIGHTLY_E2E.yml'
      - '.github/workflows/PREVIEW-ENV-DEPLOY.yml'
      - '.github/workflows/QA_REQUIRED.yml'
      - '.github/workflows/TEST_FEATURE_BRANCH.yml'
      - '.github/workflows/connectors-streak-detector.yml'
      - '.github/workflows/alwaysgreen-scripts-test.yml'
      - 'docs/alwaysgreen/FIX-AGENT.md'
  pull_request:
    paths:
      - '.github/scripts/alwaysgreen/**'
      - '.github/workflows/alwaysgreen-fix.yml'
      - '.github/workflows/BUILD_PR_DOCKER_IMAGES.yml'
      - '.github/workflows/CHECK_LICENSES.yml'
      - '.github/workflows/NIGHTLY_E2E.yml'
      - '.github/workflows/PREVIEW-ENV-DEPLOY.yml'
      - '.github/workflows/QA_REQUIRED.yml'
      - '.github/workflows/TEST_FEATURE_BRANCH.yml'
      - '.github/workflows/connectors-streak-detector.yml'
      - '.github/workflows/alwaysgreen-scripts-test.yml'
      - 'docs/alwaysgreen/FIX-AGENT.md'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install pytest
        run: pip install --quiet pytest
      - name: Run tests
        run: pytest --verbose --color=yes --tb=short .github/scripts/alwaysgreen
