# description: Classifies a failed AlwaysGreen run and dispatches the fix agent.
#              Called as the final job of MERGE_QUEUE_HELM_TEST.yaml, so
#              github.run_id is the failing run and its artifacts are readable here.
#              Also dispatchable with an explicit run_id to replay a past run.
# type: CI
# owner: @camunda/test-automation-team
---
name: AlwaysGreen Triage

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Branch the failing run was on (main, stable/8.x)'
        required: true
        type: string
      chart_version:
        description: 'Chart directory the run deployed, e.g. camunda-platform-8.10'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Classify and report, but do not dispatch'
        required: false
        type: boolean
        default: false
      max_dispatches:
        description: 'Cap on fix-agent dispatches for this run'
        required: false
        type: number
        default: 2
      parent_slack_ts:
        description: >
          ts of the post-failure-feedback message for this failure. When set, triage
          replies in that thread instead of starting a new one.
        required: false
        type: string
        default: ''
      parent_slack_channel:
        description: 'Channel of parent_slack_ts'
        required: false
        type: string
        default: ''
      tooling_ref:
        description: >
          Ref carrying this workflow's local actions and scripts. A reusable workflow's
          checkout takes the CALLER's ref, and a stable branch has none of them, so the
          tooling ref has to be named rather than inherited.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: >
          AlwaysGreen run to classify. Required: a manual replay always targets a
          specific past run. The workflow_call path does not take this input and uses
          the calling run instead.
        required: true
      base_ref:
        description: 'Branch the failing run was on'
        required: true
        default: main
      dry_run:
        description: 'Classify and report, but do not dispatch'
        type: boolean
        required: false
        default: true
      max_dispatches:
        description: 'Cap on fix-agent dispatches'
        required: false
        default: '2'
      tooling_ref:
        description: 'Ref carrying the AlwaysGreen tooling (defaults to the dispatched ref)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  TEST_OWNER: '@camunda/test-automation-team'
  FIX_WORKFLOW: alwaysgreen-fix.yml
  # The fix agent workflow only exists on the default branch; base_ref travels as an
  # input so a stable-branch failure is still fixed against its own branch.
  FIX_AGENT_REF: main
  ALERT_CHANNEL_ID: 'C0AK0AVKRL0'

jobs:
  triage:
    name: Classify and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The in-flight check is a read taken before the dispatch write, and nothing made
    # the two atomic. MERGE_QUEUE_HELM_TEST.yaml puts the commit SHA in its concurrency
    # group on protected branches, deliberately, so consecutive pushes run in parallel —
    # two of them 13 seconds apart is a real, observed pattern. Two such runs could both
    # fail, both reach triage, both see no agent running for the key, and both dispatch
    # it: two agents editing the same specs, which is the one thing the dedupe layers
    # exist to prevent.
    #
    # Serialising triage per branch closes it without new state: the second run waits,
    # and by the time it reads, the first run's fix agent exists and is visible. The
    # dispatch step already blocks until it can resolve that run, so the ordering holds.
    #
    # cancel-in-progress stays false — cancelling a triage would drop a real failure on
    # the floor. A third concurrent run displaces the queued second one, which is the
    # safe direction: a skipped triage re-triages on the next failure, a duplicate PR
    # does not un-happen.
    concurrency:
      group: alwaysgreen-triage-${{ github.repository }}-${{ inputs.base_ref }}
      cancel-in-progress: false
    steps:
      # Checkout first: the flag lives in a local composite action, and the flag
      # decides whether anything else runs.
      #
      # The ref is explicit because a reusable workflow's checkout follows the CALLER.
      # Called from stable/8.x that is a tree with no .github/actions/alwaysgreen-flag and
      # no .github/scripts/alwaysgreen, and the job dies on the first of them. There is no
      # context value for "the ref this workflow was loaded from": job_workflow_sha is
      # absent at runtime and workflow_sha is the caller's.
      #
      # run_id tells the two entry paths apart. github.event_name cannot: inside a called
      # workflow it reports the RUN's event, so a manually dispatched pipeline calling
      # triage looks identical to triage being dispatched itself. run_id is required on
      # triage's own workflow_dispatch and absent on workflow_call, so it is only set when
      # github.ref_name really is this workflow's ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling_ref || (inputs.run_id && github.ref_name) || 'main' }}
          sparse-checkout: .github
          persist-credentials: false

      # Without this the symptom is actions/checkout's "Can't find action.yml", which
      # reads as a missing checkout rather than a checkout of the wrong tree.
      - name: Verify the tooling is present
        run: |
          set -euo pipefail
          missing=""
          for p in .github/actions/alwaysgreen-flag .github/scripts/alwaysgreen/discover.py; do
            [ -e "$p" ] || missing="${missing} ${p}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::AlwaysGreen tooling missing from the checked-out ref:${missing}"
            exit 1
          fi

      # Kill switch and mode, from ALWAYSGREEN_FIX_AGENT at
      # secret/data/products/qa/ci/common:
      #
      #   disabled  nothing runs; the job exits immediately
      #   dry-run   classify and report, dispatch nothing   (default when unset)
      #   enabled   dispatch fix agents
      - name: Resolve run mode
        id: mode
        uses: ./.github/actions/alwaysgreen-flag
        with:
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          dry-run-override: ${{ inputs.dry_run }}

      - name: Report disabled and stop
        if: ${{ steps.mode.outputs.active != 'true' }}
        run: |
          {
            echo "## AlwaysGreen Triage — disabled"
            echo ""
            echo "\`ALWAYSGREEN_FIX_AGENT\` at \`secret/data/products/qa/ci/common\` is"
            echo "\`disabled\`, so no classification or dispatch ran. Set it to"
            echo "\`dry-run\` or \`enabled\` in Vault to re-enable."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::AlwaysGreen triage is disabled by the Vault feature flag."


      - name: Set up Python
        if: ${{ steps.mode.outputs.active == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Resolve target run
        if: ${{ steps.mode.outputs.active == 'true' }}
        id: target
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          CALLER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The fallback serves workflow_call, where run_id is not an input at all and
          # github.run_id is the caller's run — exactly the run that failed. On
          # workflow_dispatch run_id is required, so the fallback never applies there.
          run_id="${INPUT_RUN_ID:-$CALLER_RUN_ID}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be numeric, got '$run_id'"
            exit 1
          fi
          # base_ref is free-form on workflow_dispatch and flows into shell, jq and the
          # dispatch key. Restrict it to what a git ref can contain before any of that.
          if [[ ! "$INPUT_BASE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::base_ref contains unsupported characters"
            exit 1
          fi
          {
            echo "run_id=${run_id}"
            echo "base_ref=${INPUT_BASE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        if: ${{ steps.mode.outputs.active == 'true' }}
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@6c85c5de572dbc1790e5e7b4636c2ad9f5b614d8 # generate-github-app-token-from-vault-secrets: v1.1.0
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: connectors,c8-cross-component-e2e-tests

      - name: Discover and plan
        id: plan
        if: ${{ steps.mode.outputs.active == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          MAX_DISPATCHES: ${{ inputs.max_dispatches || '2' }}
          # Explicit rather than relying on the script default, so a replay dispatched
          # from a fork or a rename still reads the repository it is actually running in.
          ALWAYSGREEN_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python .github/scripts/alwaysgreen/discover.py \
            --run-id "$RUN_ID" \
            --base-ref "$BASE_REF" \
            --max-dispatches "$MAX_DISPATCHES" \
            --out /tmp/alwaysgreen-plan.json
          echo "count=$(jq '.dispatches | length' /tmp/alwaysgreen-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: ${{ always() && steps.mode.outputs.active == 'true' }}
        env:
          RUN_ID: ${{ steps.target.outputs.run_id }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
        run: |
          set -euo pipefail
          [ -f /tmp/alwaysgreen-plan.json ] || exit 0
          {
            echo "## AlwaysGreen Triage"
            echo ""
            echo "- run: ${RUN_ID} (\`${BASE_REF}\`)"
            echo "- mode: ${{ steps.mode.outputs.mode }} (dispatch=${{ steps.mode.outputs.dispatch }})"
            echo ""
            candidates=$(jq '.dispatches | length' /tmp/alwaysgreen-plan.json)
            if [ "$candidates" -gt 0 ] && [ "${{ steps.mode.outputs.dispatch }}" = "true" ]; then
              echo "### Dispatching"
              echo ""
              echo "| Surface | Specs | Deterministic | Key |"
              echo "|---|---|---|---|"
              jq -r '.dispatches[] | "| \(.surface) | \(.test_specs | length) | \([.test_specs[] | select(.deterministic)] | length) | `\(.dispatch_key)` |"' \
                /tmp/alwaysgreen-plan.json
              echo ""
            elif [ "$candidates" -gt 0 ]; then
              echo "### Would dispatch — withheld, mode is \`${{ steps.mode.outputs.mode }}\`"
              echo ""
              echo "| Surface | Specs | Deterministic | Key |"
              echo "|---|---|---|---|"
              jq -r '.dispatches[] | "| \(.surface) | \(.test_specs | length) | \([.test_specs[] | select(.deterministic)] | length) | `\(.dispatch_key)` |"' \
                /tmp/alwaysgreen-plan.json
              echo ""
              echo "Set \`ALWAYSGREEN_FIX_AGENT\` to \`enabled\` in Vault to dispatch these."
              echo ""
            else
              echo "> No dispatchable candidates."
              echo ""
            fi
            if [ "$(jq '.suppressed | length' /tmp/alwaysgreen-plan.json)" -gt 0 ]; then
              echo "### Suppressed"
              echo ""
              jq -r '.suppressed[] | "- `\(.surface)`: \(.reason)\(if .detail != "" then " (\(.detail))" else "" end)"' \
                /tmp/alwaysgreen-plan.json
              echo ""
            fi
            if [ "$(jq '.noise | length' /tmp/alwaysgreen-plan.json)" -gt 0 ]; then
              echo "### Not diagnosable (no dispatch)"
              echo ""
              jq -r '.noise[] | "- \(.verdict): \(.job)"' /tmp/alwaysgreen-plan.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post Slack summary
        id: slack
        # The token is a repository secret rather than a Vault read, so there is no
        # import step to gate on — an absent secret makes the step a no-op instead.
        if: ${{ steps.mode.outputs.active == 'true' && (steps.plan.outputs.count != '0' || inputs.parent_slack_ts != '') }}
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARENT_TS: ${{ inputs.parent_slack_ts }}
          PARENT_CHANNEL: ${{ inputs.parent_slack_channel }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          DISPATCHED: ${{ steps.mode.outputs.dispatch }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
        run: |
          set -euo pipefail
          [ -f /tmp/alwaysgreen-plan.json ] || echo '{"dispatches":[],"suppressed":[],"noise":[],"blame":{}}' > /tmp/alwaysgreen-plan.json
          count=$(jq '.dispatches | length' /tmp/alwaysgreen-plan.json)
          failing_url=$(jq -r '.run_url // ""' /tmp/alwaysgreen-plan.json)
          surfaces=$(jq -r '[.dispatches[].surface] | join(", ")' /tmp/alwaysgreen-plan.json)

          if [ "${PLAN_OUTCOME}" != "success" ]; then
            text=":warning: *AlwaysGreen triage failed* on \`${BASE_REF}\` — no agent dispatched"$'\n'"<${RUN_URL}|Triage run ↗>"
          elif [ "${count}" != "0" ] && [ "${DISPATCHED}" = "true" ]; then
            text=":robot_face: *AlwaysGreen fix agent dispatched* on \`${BASE_REF}\`"$'\n'"${count} agent(s): ${surfaces}"$'\n'"<${failing_url}|Failing run ↗> · <${RUN_URL}|Triage run ↗>"
          elif [ "${count}" != "0" ]; then
            # Candidates found but the gate is closed. Say so plainly: an announced
            # dispatch that never happened is worse than no message at all.
            text=":mag: *AlwaysGreen: would dispatch — withheld* on \`${BASE_REF}\`"$'\n'"${count} agent(s) held back: ${surfaces}"$'\n'"Fix-agent dispatch is off for this run."$'\n'"<${failing_url}|Failing run ↗> · <${RUN_URL}|Triage run ↗>"
          else
            # Nothing actionable. Name the reasons so the thread explains itself without
            # anyone opening the run.
            reasons=$(jq -r '
              ([.suppressed[]? | .reason] + [.noise[]? | .verdict])
              | if length == 0 then "no failing job mapped to a known surface"
                else (group_by(.) | map("\(.[0]) x\(length)") | join(", ")) end' \
              /tmp/alwaysgreen-plan.json 2>/dev/null || echo "unknown")
            text=":information_source: *AlwaysGreen triage: nothing to dispatch* on \`${BASE_REF}\`"$'\n'"${reasons}"$'\n'"<${RUN_URL}|Triage run ↗>"
          fi

          # Kept so the post-dispatch step can append agent links via chat.update
          # without rebuilding the message and drifting from this wording.
          printf '%s' "$text" > /tmp/slack-text.txt

          # Thread onto the post-failure-feedback message when the caller handed one
          # down, so one failure produces one Slack thread. Falling back to a new
          # top-level message keeps SaaS-only failures (whose stage posts no feedback)
          # and Slack outages reported rather than silent.
          if [ -n "${PARENT_TS}" ] && [ -n "${PARENT_CHANNEL}" ]; then
            channel="${PARENT_CHANNEL}"
            payload=$(jq -nc --arg channel "$channel" --arg ts "${PARENT_TS}" --arg text "$text" \
              '{channel: $channel, thread_ts: $ts, text: $text, mrkdwn: true}')
          else
            channel="${{ env.ALERT_CHANNEL_ID }}"
            payload=$(jq -nc --arg channel "$channel" --arg text "$text" \
              '{channel: $channel, text: $text, mrkdwn: true}')
          fi

          resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" || echo '{}')
          [ "$(jq -r '.ok // false' <<<"$resp")" = "true" ] \
            || echo "::warning::Slack post failed: $(jq -r '.error // "unknown"' <<<"$resp")"

          # The fix agent must reply as a sibling in the SAME thread, so pass the parent
          # ts through when threading; our own reply's ts would nest nothing useful.
          out_ts="${PARENT_TS:-$(jq -r '.ts // ""' <<<"$resp")}"
          {
            echo "ts=${out_ts}"
            # This message's own ts, which is NOT out_ts when threading: editing the
            # parent's ts would overwrite the post-failure-feedback message instead.
            echo "self_ts=$(jq -r '.ts // ""' <<<"$resp")"
            echo "channel=$(jq -r --arg c "$channel" '.channel // $c' <<<"$resp")"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch fix agents
        id: dispatch
        # outcome, not just count: a failed discovery leaves count empty, and '' != '0'
        # would otherwise dispatch with no plan file.
        if: ${{ steps.mode.outputs.dispatch == 'true' && steps.plan.outcome == 'success' && steps.plan.outputs.count != '0' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          SLACK_TS: ${{ steps.slack.outputs.ts }}
          SLACK_CHANNEL: ${{ steps.slack.outputs.channel }}
          TRIAGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # workflow_dispatch caps at 10 inputs and the list below is at exactly 10, so
          # blame/slack/evidence travel as single JSON objects. The fix workflow unpacks
          # them in its first step; anything new has to join one of those bundles.
          blame_json=$(jq -c '{reviewer: (.blame.reviewer // ""),
                               author:   (.blame.author // ""),
                               pr:       (.blame.pr_number // "" | tostring)}' \
                        /tmp/alwaysgreen-plan.json)
          slack_json=$(jq -nc --arg ts "${SLACK_TS:-}" --arg channel "${SLACK_CHANNEL:-}" \
                        '{ts: $ts, channel: $channel}')
          failing_run_url=$(jq -r '.run_url' /tmp/alwaysgreen-plan.json)

          # Only runs created from here on can be ours; earlier runs carry the same
          # run-name and would otherwise be matched by mistake on a repeat replay.
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          : > /tmp/agent-runs.tsv

          jq -c '.dispatches[]' /tmp/alwaysgreen-plan.json | while read -r d; do
            key=$(jq -r '.dispatch_key' <<<"$d")
            echo "Dispatching ${key}"
            gh workflow run "${FIX_WORKFLOW}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${FIX_AGENT_REF}" \
              -f dispatch_key="${key}" \
              -f base_ref="$(jq -r '.base_ref' <<<"$d")" \
              -f surface="$(jq -r '.surface' <<<"$d")" \
              -f test_specs="$(jq -c '.test_specs' <<<"$d")" \
              -f fingerprints="$(jq -c '.fingerprints' <<<"$d")" \
              -f evidence="$(jq -c '{run_url: .evidence_run_url, repo: .evidence_repo}' <<<"$d")" \
              -f failing_run_url="${failing_run_url}" \
              -f triage_run_url="${TRIAGE_RUN_URL}" \
              -f blame="${blame_json}" \
              -f slack="${slack_json}"

            # `gh workflow run` returns no run id, so resolve it from the run-name,
            # which carries the dispatch key verbatim. Poll: the run takes a moment
            # to appear, and two dispatches would otherwise race on "newest run".
            url=""
            for _ in 1 2 3 4 5 6 7 8; do
              sleep 3
              url=$(gh run list --repo "${GITHUB_REPOSITORY}" \
                      --workflow "${FIX_WORKFLOW}" --limit 20 \
                      --json url,displayTitle,createdAt \
                    | jq -r --arg t "AlwaysGreen fix [${key}]" --arg since "${started_at}" \
                        'map(select(.displayTitle == $t and .createdAt >= $since))
                         | (.[0].url // "")')
              [ -n "$url" ] && break
            done
            if [ -n "$url" ]; then
              printf '%s\t%s\n' "${key}" "${url}" >> /tmp/agent-runs.tsv
            else
              echo "::warning::Dispatched ${key} but could not resolve its run URL."
            fi
          done

      # The Slack summary is posted before dispatch, because the fix agent needs its
      # ts to reply in-thread. So the agent links can only be added afterwards.
      - name: Add agent links to Slack
        # hashFiles() cannot see outside GITHUB_WORKSPACE, so the file checks live in
        # the script rather than in this condition.
        if: ${{ always() && steps.slack.outputs.self_ts != '' }}
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          SLACK_TS: ${{ steps.slack.outputs.self_ts }}
          SLACK_CHANNEL: ${{ steps.slack.outputs.channel }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -s /tmp/slack-text.txt ] || { echo "No posted message to update."; exit 0; }

          # The message already claims agents were dispatched — it has to be posted
          # first, because the agent needs its ts to reply in-thread. So if the dispatch
          # then failed, or produced no run at all, the thread is left asserting an
          # agent that does not exist and nobody is told. Correct it here.
          if [ "${DISPATCH_OUTCOME}" = "failure" ] || \
             { [ "${DISPATCH_OUTCOME}" = "success" ] && [ ! -s /tmp/agent-runs.tsv ]; }; then
            echo "::error::fix-agent dispatch did not start any run; the Slack thread has been corrected"
            text="$(cat /tmp/slack-text.txt)"$'\n'":x: *Dispatch failed* — no fix agent was started, so the line above is not accurate. <${RUN_URL}|Triage run ↗>"
          else
            [ -s /tmp/agent-runs.tsv ] || { echo "No agent runs to link."; exit 0; }
            links=$(awk -F'\t' '{printf "%s<%s|%s ↗>", sep, $2, $1; sep=" · "}' /tmp/agent-runs.tsv)
            text="$(cat /tmp/slack-text.txt)"$'\n'"Agents: ${links}"
          fi

          # A threaded reply is updated by its own ts; chat.update needs no thread_ts.
          payload=$(jq -nc --arg channel "${SLACK_CHANNEL}" --arg ts "${SLACK_TS}" --arg text "$text" \
            '{channel: $channel, ts: $ts, text: $text}')
          resp=$(curl -sS -X POST https://slack.com/api/chat.update \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" || echo '{}')
          [ "$(jq -r '.ok // false' <<<"$resp")" = "true" ] \
            || echo "::warning::Slack update failed: $(jq -r '.error // "unknown"' <<<"$resp")"

      - name: Flag discovery failure
        if: ${{ steps.mode.outputs.active == 'true' && steps.plan.outcome != 'success' }}
        run: |
          echo "::warning::AlwaysGreen discovery failed; no fix agent was dispatched for this run."
          {
            echo "## AlwaysGreen Triage"
            echo ""
            echo ":warning: Discovery failed — see the \`Discover and plan\` step. No agent dispatched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alwaysgreen-triage-${{ steps.target.outputs.run_id }}-${{ github.run_attempt }}
          path: /tmp/alwaysgreen-plan.json
          retention-days: 14
          if-no-files-found: warn

      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          job_name: alwaysgreen-triage
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
