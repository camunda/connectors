# description: Unit tests for the streak job in connectors-streak-detector.yml. The job
# only runs from the copy on the default branch, so these tests are the only check a
# change to it gets before merge.
# type: CI
# owner: @camunda/connectors
---
name: Streak detector test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/connectors-streak-detector.yml'
      - '.github/workflows/scripts/test_streak_detector.py'
      - '.github/workflows/streak-detector-test.yml'
  pull_request:
    paths:
      - '.github/workflows/connectors-streak-detector.yml'
      - '.github/workflows/scripts/test_streak_detector.py'
      - '.github/workflows/streak-detector-test.yml'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: camunda/infra-global-github-actions/start-build-monitor@ead99f6c9c536f5c47e443929d47e8fcfdb05a81 # start-build-monitor-1.0.1
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 .github/workflows/scripts/test_streak_detector.py --verbose

      - name: Validate telemetry refs
        id: telemetry-ref-safety
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          case "$HEAD_REF$BASE_REF" in
            *['$`"']*)
              echo "::warning::Build status not submitted because a branch name contains unsupported characters."
              exit 1
              ;;
          esac

      - name: Submit build status
        if: always() && steps.telemetry-ref-safety.outcome == 'success'
        continue-on-error: true
        uses: camunda/infra-global-github-actions/submit-build-status@25d228468383a1d73dfe3a261a6d0c6b0296fa45 # submit-build-status-1.3.4
        with:
          build_status: ${{ job.status }}
