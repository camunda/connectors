name: Maven bootstrap diagnostic for PR 9546
run-name: Maven bootstrap diagnostic for PR 9546

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: gcp-core-8-default
    timeout-minutes: 5
    env:
      MVNW_VERBOSE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fa767ad97df55fe6ec7f2cc405743a73d8989ee3
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
      - name: Check Maven bootstrap with an empty distribution directory
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-bootstrap-9546-${{ github.run_id }}
        run: |
          test ! -e "$MAVEN_USER_HOME"
          wget --version | head -n 1
          ./mvnw --version
      - name: Check reuse of the downloaded Maven distribution
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-bootstrap-9546-${{ github.run_id }}
        run: ./mvnw --version
