# description: Everything AlwaysGreen does when a "Merge queue Helm test" run
# finishes, for main and every stable/* branch from this one copy. Two independent
# reactions, one per job below:
#
#   triage  -- any run carrying a failed job is handed to AlwaysGreen triage, which
#              classifies it and dispatches the fix agent. See the comment on that
#              job for why this cannot be an `if:` inside the pipeline itself.
#   streak  -- consecutive non-green runs on a base ref maintain ONE live Slack
#              message per branch in the connectors support channel.
#
# The filename still says streak-detector: renaming it would create a new workflow
# identity, and GitHub cannot dispatch a workflow file that is absent from the default
# branch, which is exactly what makes the triage half replayable before it merges.
#
# Streak behaviour:
#   - First failure that crosses STREAK_THRESHOLD on a base ref: chat.postMessage
#     (medic notified once).
#   - Subsequent failed runs while the streak is active: chat.update on the same
#     message (silent — Slack does not re-notify on edits).
#   - First successful run after a streak: chat.update flips the message to
#     resolved. No new notification.
#
# Medic routing (derived from the failing job names in the newest failing run, which
# need not be the triggering one; a SaaS-only failure routes to test automation):
#   - Connectors image build            -> connectors medic (secret)
#   - Helm chart setup / integration     -> distro medic
#   - SaaS / AI Agent E2E tests          -> test-automation medic
#
# NOTE: workflow_run workflows run from the repository default branch only, so a
# single copy on `main` handles main + every stable/* branch (it normalises the
# triggering run's head_branch). Copies on stable branches are inert.
# type: CI
# owner: @camunda/connectors
---
name: AlwaysGreen Merge Queue Watch

on:
  workflow_run:
    # "SaaS E2E result" is judged for the streak only. The SaaS stage no longer runs
    # inside the pipeline run, so its failures reach the streak through that run, and
    # triage is invoked from it directly (see SAAS_E2E_RESULT.yaml).
    workflows: ["Merge queue Helm test", "SaaS E2E result"]
    types:
      - completed
  # Manual replay for the triage half, mirroring the central triage's own dispatch
  # path. Re-runs the decision for a past pipeline run without re-running the pipeline,
  # and is the only way to exercise a workflow_run workflow, which otherwise fires only
  # for the copy on the default branch. The streak job stays out of it: its gate wants a
  # push-triggered pipeline run, which a dispatch does not carry.
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Pipeline run to judge. Required: a replay always names its target.'
        required: true
      dry_run:
        description: 'Classify and report, but dispatch no fix agent'
        type: boolean
        required: false
        default: true

env:
  ALERT_CHANNEL_ID: 'C0AK0AVKRL0'
  STREAK_THRESHOLD: '3'
  LOOKBACK_RUNS: '10'
  PARENT_WORKFLOW_FILE: 'MERGE_QUEUE_HELM_TEST.yaml'
  SAAS_RESULT_WORKFLOW_FILE: 'SAAS_E2E_RESULT.yaml'
  # Marker embedded in the Slack message text so later runs can find and update
  # their own message. Base-ref scoped so main / stable/* streaks don't collide.
  STREAK_MARKER_ACTIVE: 'Merge queue Helm test streak (active)'
  STREAK_MARKER_RESOLVED: 'Merge queue Helm test streak (resolved)'
  # Subteam IDs are workspace identifiers, not secrets (same convention as
  # camunda/camunda). The connectors medic is referenced via the existing repo
  # secret, consistent with the other connectors Slack notifications.
  MEDIC_DISTRO: '<!subteam^S053K7C7QKU>'
  MEDIC_TEST_AUTOMATION: '<!subteam^S09UF0EV0HG>'

defaults:
  run:
    shell: bash

jobs:
  # Ungrouped, so an event that turns out to be irrelevant never enters a branch's
  # concurrency group: GitHub keeps one pending job per group and replaces it with the
  # newest, so a merge-group SaaS callback (its run sits on main) would otherwise evict
  # a pending main scan and then skip its own.
  streak-context:
    name: Resolve streak context
    # Only protected-branch push runs accumulate streaks; success runs can
    # resolve an existing live message. A SaaS result run is let through here and
    # filtered by the step below, which looks up the pipeline run it reports on.
    if: >-
      github.event.workflow_run.name == 'SaaS E2E result' ||
      (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'stable/')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      relevant: ${{ steps.ctx.outputs.relevant }}
      base_ref: ${{ steps.ctx.outputs.base_ref }}
    steps:
      - name: Resolve the pipeline run this event reports on
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          relevant=true
          base_ref="${HEAD_BRANCH}"
          if [ "$RUN_NAME" = "SaaS E2E result" ]; then
            # Run name: `saas-e2e-result <repo>:<run_id>:<attempt>:<sha>`.
            if [[ "$RUN_TITLE" =~ ^saas-e2e-result\ ${GITHUB_REPOSITORY}:([0-9]+):[0-9]+:[0-9a-f]{40}$ ]]; then
              meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASH_REMATCH[1]}")
              base_ref=$(jq -r '.head_branch // ""' <<<"$meta")
              [ "$(jq -r '.event' <<<"$meta")" = "push" ] || relevant=false
              case "$base_ref" in
                main|stable/*) ;;
                *) relevant=false ;;
              esac
            else
              relevant=false
            fi
          fi
          {
            echo "relevant=${relevant}"
            echo "base_ref=${base_ref}"
          } >> "$GITHUB_OUTPUT"

  detect-streak:
    name: Detect failure streak
    needs: streak-context
    if: needs.streak-context.outputs.relevant == 'true'
    # Per branch, because this job maintains ONE live Slack message per base ref and two
    # concurrent updates would fight over it. Job-scoped rather than workflow-scoped: at
    # workflow level it also governed the triage jobs below, and on a manual replay
    # `workflow_run.head_branch` is empty, so every replay collapsed into one bucket and
    # GitHub cancelled all but one of them -- observed, three of five replays cancelled
    # with no job run at all. The scan must never be dropped that way.
    concurrency:
      # The branch the event reports on: a SaaS result run executes on the default
      # branch whatever pipeline run it belongs to.
      group: streak-${{ github.workflow }}-${{ needs.streak-context.outputs.base_ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Detect failure streak on this base branch
        id: streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ needs.streak-context.outputs.base_ref }}
        run: |
          set -euo pipefail
          RUNS_JSON=$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "${PARENT_WORKFLOW_FILE}" \
            --branch "${BASE_REF}" \
            --limit "${LOOKBACK_RUNS}" \
            --json databaseId,conclusion,status,event,createdAt,url 2>/dev/null || echo '[]')
          # The SaaS stage reports through its own run, keyed `<run_id>:<attempt>` by
          # its run name. The newest result per key wins.
          SAAS_JSON=$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "${SAAS_RESULT_WORKFLOW_FILE}" \
            --status completed \
            --limit 100 \
            --json conclusion,displayTitle,createdAt,databaseId,url 2>/dev/null || echo '[]')
          SAAS_RESULTS=$(jq '
            sort_by(.createdAt)
            | map((.displayTitle | split(" ") | .[1] // "" | split(":")) as $c
                  | select(($c | length) == 4)
                  | {key: "\($c[1]):\($c[2])", value: {conclusion, id: .databaseId, url}})
            | from_entries
          ' <<<"$SAAS_JSON")

          # Each completed push run, newest first, is `failed`, `green` or `pending`.
          # A green pipeline run is only green once its SaaS result is in: until then it
          # is pending, and a pending run neither counts towards nor breaks the streak.
          # Its result is the one for the attempt that ran the dispatch, which is the
          # attempt that last ran the trigger job -- a re-run of only the failed jobs
          # reuses it, a full re-run dispatches again and supersedes it.
          #
          # A trigger job that still has the waiting step (stable-branch copies, and runs
          # from before the callback) failed the run itself, so there the run's own
          # conclusion is the whole answer. A callback that never arrives -- the
          # downstream run was cancelled before it could report -- leaves its run
          # pending until it ages out of the lookback window.
          #
          # The newest failure is remembered with the run that actually carries the
          # evidence: the pipeline run, or for a SaaS-only failure its result run. The
          # event that fires this job can be the other, successful, one.
          statuses=()
          FAIL_ID=""; FAIL_URL=""; FAIL_KIND=""
          note_failure() {
            if [ -z "$FAIL_ID" ]; then FAIL_ID="$1"; FAIL_URL="$2"; FAIL_KIND="$3"; fi
          }
          while IFS=$'\t' read -r id conclusion url; do
            case "$conclusion" in
              failure|timed_out|cancelled) statuses+=(failed); note_failure "$id" "$url" pipeline; continue ;;
            esac
            trigger=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "Trigger SaaS E2E tests")] | first // {}')
            dispatched=$(jq -r '
              ([.steps[]? | select(.name == "Trigger repository_dispatch for SaaS Connectors" and .conclusion == "success")] | length > 0)
              and ([.steps[]? | select(.name | startswith("Wait for downstream"))] | length == 0)
            ' <<<"$trigger")
            if [ "$dispatched" != "true" ]; then
              statuses+=(green)
              continue
            fi
            key="${id}:$(jq -r '.run_attempt' <<<"$trigger")"
            case "$(jq -r --arg k "$key" '.[$k].conclusion // "pending"' <<<"$SAAS_RESULTS")" in
              success) statuses+=(green) ;;
              pending) statuses+=(pending) ;;
              *)
                statuses+=(failed)
                note_failure "$(jq -r --arg k "$key" '.[$k].id' <<<"$SAAS_RESULTS")" \
                  "$(jq -r --arg k "$key" '.[$k].url' <<<"$SAAS_RESULTS")" saas
                ;;
            esac
          done < <(jq -r '
            [ .[] | select(.status == "completed") | select(.event == "push") ]
            | sort_by(.createdAt) | reverse | .[] | "\(.databaseId)\t\(.conclusion)\t\(.url)"
          ' <<<"$RUNS_JSON")

          STREAK=0
          LATEST_SUCCESS=false
          for st in "${statuses[@]}"; do
            case "$st" in
              failed) STREAK=$((STREAK + 1)) ;;
              green) [ "$STREAK" -eq 0 ] && LATEST_SUCCESS=true; break ;;
            esac
          done
          IS_STREAK=$([[ ${STREAK} -ge ${STREAK_THRESHOLD} ]] && echo true || echo false)
          {
            echo "streak_count=${STREAK}"
            echo "base_ref=${BASE_REF}"
            echo "is_streak=${IS_STREAK}"
            echo "latest_success=${LATEST_SUCCESS}"
            echo "fail_run_id=${FAIL_ID}"
            echo "fail_run_url=${FAIL_URL}"
            echo "fail_kind=${FAIL_KIND}"
          } >> "$GITHUB_OUTPUT"
          echo "Streak on ${BASE_REF}: ${STREAK}/${STREAK_THRESHOLD} (newest first: ${statuses[*]:-none})"

      - name: Resolve medics for this run's failed jobs
        id: medics
        if: steps.streak.outputs.is_streak == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_RUN_ID: ${{ steps.streak.outputs.fail_run_id }}
          FAIL_KIND: ${{ steps.streak.outputs.fail_kind }}
          CONNECTORS_MEDIC: ${{ secrets.CONNECTORS_MEDIC_SLACK_GROUP_ID }}
        run: |
          set -euo pipefail
          if [ "$FAIL_KIND" = "saas" ]; then
            # The result run's jobs are bookkeeping; the failure is a SaaS E2E one.
            FAILED="SaaS E2E tests"
          else
            FAILED=$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${FAIL_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") | .name' || true)
          fi
          echo "Failed jobs:"; echo "${FAILED}"
          mentions=()
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            case "$name" in
              # First: the AlwaysGreen jobs themselves. Matched ahead of the stage
              # patterns because "AlwaysGreen failure feedback (SM E2E)" failing means
              # the feedback tooling broke, not the SM deploy — the deploy failure is a
              # separate job and still routes to distro below.
              *"AlwaysGreen"*)
                mentions+=("${MEDIC_TEST_AUTOMATION}") ;;
              *"SaaS E2E"*|*"AI Agent"*)
                mentions+=("${MEDIC_TEST_AUTOMATION}") ;;
              *"SM E2E"*|*"Helm chart"*|*"Integration"*)
                mentions+=("${MEDIC_DISTRO}") ;;
              *)
                mentions+=("${CONNECTORS_MEDIC}") ;;
            esac
          done <<<"${FAILED}"
          # Nothing attributable (e.g. run died before jobs ran) -> connectors
          # medic owns the pipeline plumbing.
          if (( ${#mentions[@]} == 0 )); then mentions+=("${CONNECTORS_MEDIC}"); fi
          pings=$(printf '%s\n' "${mentions[@]}" | awk 'NF && !seen[$0]++' | paste -sd ' ' -)
          echo "pings=${pings}" >> "$GITHUB_OUTPUT"
          echo "Will ping: ${pings}"

      - name: Find existing Slack streak message for this base
        id: find-message
        if: steps.streak.outputs.is_streak == 'true' || steps.streak.outputs.latest_success == 'true'
        continue-on-error: true
        env:
          SLACK_TOKEN: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          CHANNEL_ID: C0AK0AVKRL0
          BASE_REF: ${{ steps.streak.outputs.base_ref }}
        run: |
          set -euo pipefail
          ACTIVE_MARKER="${STREAK_MARKER_ACTIVE} on ${BASE_REF}"
          echo "active_marker=${ACTIVE_MARKER}" >> "$GITHUB_OUTPUT"
          RESPONSE=$(curl -sS -X GET \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL_ID}&limit=100")
          if [[ "$(jq -r '.ok // false' <<<"$RESPONSE")" != "true" ]]; then
            echo "conversations.history failed: $(jq -r '.error // "unknown"' <<<"$RESPONSE") — will post fresh"
            echo "existing_ts=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCH=$(jq -c --arg m "$ACTIVE_MARKER" '
            [ .messages[]? | select((.text // "") | contains($m)) ]
            | sort_by(.ts) | reverse | .[0] // null
          ' <<<"$RESPONSE")
          if [[ "$MATCH" == "null" || -z "$MATCH" ]]; then
            echo "existing_ts=" >> "$GITHUB_OUTPUT"
          else
            echo "existing_ts=$(jq -r '.ts' <<<"$MATCH")" >> "$GITHUB_OUTPUT"
          fi

      - name: Post new streak alert to Slack (notifies medic)
        if: steps.streak.outputs.is_streak == 'true' && steps.find-message.outputs.existing_ts == ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0AK0AVKRL0",
              "text": ":rotating_light: ${{ steps.find-message.outputs.active_marker }} (${{ steps.streak.outputs.streak_count }} consecutive failures)\n${{ steps.medics.outputs.pings }} — please triage.\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ env.PARENT_WORKFLOW_FILE }}|${{ env.PARENT_WORKFLOW_FILE }}> on `${{ steps.streak.outputs.base_ref }}`\nLatest failing run: ${{ steps.streak.outputs.fail_run_url }}"
            }

      - name: Update existing streak alert in Slack (silent edit)
        if: steps.streak.outputs.is_streak == 'true' && steps.find-message.outputs.existing_ts != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0AK0AVKRL0",
              "ts": "${{ steps.find-message.outputs.existing_ts }}",
              "text": ":rotating_light: ${{ steps.find-message.outputs.active_marker }} (${{ steps.streak.outputs.streak_count }} consecutive failures, ongoing)\n${{ steps.medics.outputs.pings }} — still triaging.\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ env.PARENT_WORKFLOW_FILE }}|${{ env.PARENT_WORKFLOW_FILE }}> on `${{ steps.streak.outputs.base_ref }}`\nLatest failing run: ${{ steps.streak.outputs.fail_run_url }}"
            }

      - name: Mark streak as resolved in Slack (silent edit)
        if: steps.streak.outputs.latest_success == 'true' && steps.find-message.outputs.existing_ts != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0AK0AVKRL0",
              "ts": "${{ steps.find-message.outputs.existing_ts }}",
              "text": ":white_check_mark: ${{ env.STREAK_MARKER_RESOLVED }} on ${{ steps.streak.outputs.base_ref }} — first green run after the streak.\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ env.PARENT_WORKFLOW_FILE }}|${{ env.PARENT_WORKFLOW_FILE }}>\nFirst green run: ${{ github.event.workflow_run.html_url }}"
            }

  # The triage half. Why the decision lives here and not as an `if:` inside the
  # pipeline:
  #
  # It used to be a job in MERGE_QUEUE_HELM_TEST.yaml gated on
  # `contains(needs.*.result, 'failure')`, which is blind to two of the ways a job in
  # that pipeline fails:
  #
  #   * a nested job of a called workflow carrying continue-on-error -- the SM
  #     Playwright matrix in camunda-platform-helm runs its `full` leg with
  #     `continue-on-error: ${{ !matrix.blocking }}`, so a `full`-only failure leaves
  #     `needs.trigger-sm-e2e.result == 'success'`;
  #   * the pipeline's own `continue-on-error: ${{ github.event_name == 'merge_group' }}`,
  #     one level up.
  #
  # It also could not be fixed centrally, because that file is per-branch: the jobs-API
  # fix reached main only, and stable/8.7-8.10 kept reading `needs.*.result`. A reusable
  # workflow cannot help either -- it cannot reach into its caller's `if:`, because it
  # never runs. A workflow_run listener can, and covers every branch from this one copy.
  #
  # Measured over the 100 most recent completed runs (2026-09-03) -- 55 merge_group, 45
  # push -- carrying 73 non-AlwaysGreen job failures:
  #
  #   main base    23 failures, all already covered by the jobs-API gate on that branch
  #   stable bases 50 failures, of which its push-only + needs.*.result gate saw 6
  #                (SM 0/23, SaaS 0/13, build 6/14)
  #
  # Every stable SaaS failure was invisible, and every one of them was on merge_group,
  # which that gate excluded outright.
  #
  # This listener fires for both event types: over the same window, 104/104 merge_group
  # and 88/88 push pipeline completions produced a run of it.
  # Deliberately ungrouped: it is a read, it is cheap, and every finished run must get
  # one. Serialisation belongs to triage, which declares its own per-base_ref group.
  scan-run:
    name: Scan the finished run
    # A SaaS result run triages itself (SAAS_E2E_RESULT.yaml); only the streak job above
    # looks at it.
    if: github.event.workflow_run.name != 'SaaS E2E result'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.run.outputs.id }}
      any_failed: ${{ steps.scan.outputs.any_failed }}
      already_triaged: ${{ steps.scan.outputs.already_triaged }}
      base_ref: ${{ steps.scan.outputs.base_ref }}
      base_ref_supported: ${{ steps.scan.outputs.base_ref_supported }}
      parent_slack_ts: ${{ steps.parent.outputs.slack_ts }}
      parent_slack_channel: ${{ steps.parent.outputs.slack_channel }}
    steps:
      - name: Resolve the run to judge
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be numeric, got '${run_id}'"
            exit 1
          fi

          # Conclusion, url and branch are read from the API rather than from
          # github.event.workflow_run, so a manual replay and a triggered run take the
          # same path and neither can be judged on a field the other does not have.
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          if [ "$(jq -r '.workflow_id // "" ' <<<"$meta")" = "" ]; then
            echo "::error::run ${run_id} could not be read: $(head -c 300 <<<"$meta")"
            exit 1
          fi

          # A replay of the wrong workflow would classify jobs the AlwaysGreen surfaces
          # know nothing about, and report a clean triage for a pipeline that never ran.
          name=$(jq -r '.name // ""' <<<"$meta")
          if [ "$name" != "Merge queue Helm test" ]; then
            echo "::error::run ${run_id} is '${name}', not a Merge queue Helm test run"
            exit 1
          fi

          # A re-run reuses the run id and increments the attempt, and workflow_run fires
          # once per attempt -- while the scan below asks for `filter=latest`. So a
          # listener for attempt N that starts late reads attempt N+1's jobs: if N+1 has
          # finished, both listeners classify the same attempt and post the same failure
          # twice; if it is still running, N's listener reads partial state.
          #
          # The newest attempt is the one worth judging, so the stale listener stands
          # down rather than the newer one -- which also keeps `filter=latest` honest for
          # the replay path, where a typed run id means "whatever that run looks like
          # now".
          stale=false
          current_attempt=$(jq -r '.run_attempt // 1' <<<"$meta")
          if [ -n "${EVENT_RUN_ATTEMPT:-}" ] \
             && [ "${EVENT_RUN_ATTEMPT}" -lt "${current_attempt}" ]; then
            stale=true
            echo "::notice::attempt ${EVENT_RUN_ATTEMPT} of run ${run_id} is superseded by attempt ${current_attempt}; standing down."
            {
              echo "## AlwaysGreen failure watch"
              echo ""
              echo "Attempt ${EVENT_RUN_ATTEMPT} of run ${run_id} was superseded by"
              echo "attempt ${current_attempt}, whose own listener judges it. Nothing done here."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # An unfinished run has a partial job list, and reading it as final would
          # either report a green pipeline that has not finished failing yet or invoke
          # triage before the evidence artifacts are uploaded. The workflow_run event
          # only fires on `completed`, so this mainly guards the replay path, where a run
          # id is typed by hand and nothing else checks.
          #
          # After the stale check, and skipped for a stale listener. A re-run puts the
          # shared run back to `in_progress`, so an ordinary re-run would otherwise turn
          # every superseded listener into a failed watcher run instead of a quiet
          # stand-down.
          if [ "$stale" != "true" ]; then
            status=$(jq -r '.status // ""' <<<"$meta")
            if [ "$status" != "completed" ]; then
              echo "::error::run ${run_id} is '${status}', not completed; there is nothing final to judge yet"
              exit 1
            fi
          fi

          {
            echo "id=${run_id}"
            echo "stale=${stale}"
            echo "url=$(jq -r '.html_url' <<<"$meta")"
            echo "conclusion=$(jq -r '.conclusion // "" ' <<<"$meta")"
            echo "head_branch=$(jq -r '.head_branch // "" ' <<<"$meta")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Scan the run's job conclusions
        id: scan
        if: steps.run.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.id }}
          RUN_URL: ${{ steps.run.outputs.url }}
          RUN_CONCLUSION: ${{ steps.run.outputs.conclusion }}
          HEAD_BRANCH: ${{ steps.run.outputs.head_branch }}
          IS_REPLAY: ${{ github.event_name == 'workflow_dispatch' }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          # The attempt this listener was fired for, by its own endpoint, when there is
          # one. `filter=latest` reads whatever the newest attempt happens to be AT THE
          # MOMENT OF THE REQUEST, so the earlier stale check could only ever narrow the
          # window, not close it: a re-run starting between that check and this request
          # left this listener scanning the new attempt's partial job list, and the new
          # attempt's own listener classifying it again afterwards. An attempt's job list
          # is immutable, so asking for it by number removes the race instead of
          # shrinking it.
          #
          # A replay has no attempt to be faithful to -- a typed run id means "whatever
          # that run looks like now" -- so it keeps `filter=latest`.
          #
          # Residual, deliberately: a re-run that starts after this point is classified
          # by its own listener, not this one. Two attempts, two classifications, each
          # complete and correct for what it judged; the dispatch dedupe covers the
          # overlap between them. That is the honest outcome, unlike one listener
          # reporting on half of somebody else's attempt.
          if [ -n "${EVENT_RUN_ATTEMPT:-}" ]; then
            jobs_path="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${EVENT_RUN_ATTEMPT}/jobs?per_page=100"
          else
            jobs_path="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100"
          fi

          # --slurp, then flatten to one object. Without it `--paginate` emits one JSON
          # document PER PAGE, so past 100 jobs every query below runs once per page: the
          # `| length` tests then produce two numbers, and `[ "1\n0" -gt 0 ]` aborts the
          # step under `set -e`. Verified. This pipeline is at ~20 jobs today, so it is a
          # latent break rather than a live one -- but it breaks the gate, not a report.
          jobs_json=$(gh api --paginate --slurp "$jobs_path" | jq '{jobs: [.[].jobs[]]}')

          # Fail loudly on anything that is not a job listing. The whole point of this
          # workflow is that a real failure must not read as a green run, so an
          # unreadable answer has to be a red job here rather than a quiet `any_failed=false`.
          if ! jq -e 'has("jobs") and (.jobs | type == "array")' <<<"$jobs_json" >/dev/null; then
            echo "::error::could not list jobs for run ${RUN_ID}; got: $(head -c 300 <<<"$jobs_json")"
            exit 1
          fi

          # stable/8.7-8.10 still carry their own push-gated `alwaysgreen-triage` job,
          # which classifies the run from inside it. When that job actually did the work,
          # this listener must not classify the same run again: two classifications mean
          # two Slack threads for one failure, and the only thing standing between them
          # and two fix agents is triage's in-flight check winning a race. It is
          # measurable -- 6 of the last 100 runs were stable pushes whose failure
          # propagated far enough to satisfy that gate.
          #
          # "Did the work" cannot be read from the job's conclusion. Triage runs
          # `Discover and plan` with continue-on-error, and `Flag discovery failure` only
          # warns, so a run whose discovery blew up still concludes `success` -- and
          # suppressing that would kill the retry this check is supposed to allow. Nor can
          # the step's own conclusion be used: a continue-on-error step reports `success`
          # in this API whatever happened to it. What IS reported faithfully is `skipped`,
          # so the two flag steps are read instead:
          #
          #   Flag discovery failure   skipped -> discovery succeeded
          #   Report disabled and stop skipped -> the Vault flag was not `disabled`
          #   Flag dispatch failure    skipped -> a dispatch, if due, started an agent
          #
          # All three skipped, on a job that concluded success, is the only state that
          # means a classification actually happened AND left something behind. The third
          # exists because `Dispatch fix agents` is continue-on-error as well, so a failed
          # `gh workflow run` left the job successful with the other two still skipped --
          # and the retry was suppressed for a run where no agent ever started.
          #
          # Automatic runs only. A manual replay names its target on purpose, and
          # refusing to re-classify a run someone explicitly asked about would make the
          # replay path useless for every historical run -- which is most of them.
          #
          # Self-clearing: as each stable branch drops its in-pipeline job the check stops
          # matching and the listener takes over.
          already_triaged=false
          if [ "${IS_REPLAY}" != "true" ] \
             && [ "$(jq '[.jobs[]
                          | select(.name | startswith("AlwaysGreen triage and fix dispatch"))
                          | select(.conclusion == "success")
                          | select([.steps[]?
                              | select(.name == "Flag discovery failure" or
                                       .name == "Report disabled and stop" or
                                       .name == "Flag dispatch failure")
                              | select(.conclusion != "skipped")] | length == 0)]
                         | length' <<<"$jobs_json")" -gt 0 ]; then
            already_triaged=true
          fi

          # Nested jobs of called workflows are in this list too, under
          # `<caller job> / <called job>` names, so one scan covers the whole tree --
          # including the SM Playwright legs three levels down in camunda-platform-helm.
          #
          # A `cancelled` job counts, but only when the run as a whole was not
          # cancelled. That distinguishes a job hitting its own `timeout-minutes` -- how
          # the SaaS stage dies when the downstream run outlives its 25-minute watcher,
          # and a real failure nothing currently reports -- from the merge queue or a
          # human dropping the whole run, which is not a test failure and must not page
          # anyone.
          #
          # Step conclusions are deliberately NOT scanned. `steps[].conclusion` in this
          # API is the outcome AFTER continue-on-error, so a masked step reports
          # `success` (checked directly: the `Observe build status` step of job
          # 100567857518 emitted `##[error]` and still reports `success`). Every step
          # failure the API can express therefore already shows up as its job's
          # `failure`, and scanning steps adds nothing -- 0 extra hits over the same 34
          # runs. Catching a masked step would mean parsing logs or annotations, and
          # those steps are non-fatal on purpose.
          if [ "${RUN_CONCLUSION}" = "cancelled" ]; then
            countable='["failure"]'
          else
            countable='["failure","cancelled","timed_out"]'
          fi

          # AlwaysGreen's own jobs are excluded: a Slack or Vault hiccup in the feedback
          # job is not a pipeline failure, and treating it as one would have triage
          # re-triaging its own noise.
          #
          # The current "AI Agent bundle E2E" name and legacy "AI Agent E2E Tests" name
          # are excluded here too, mirroring classify.py's IGNORED_JOB_PREFIXES. This
          # gate reads raw job conclusions and knows nothing about that list, so without
          # these exclusions a run whose only failure is that job still sets
          # any_failed=true, still gets handed to triage, and triage's "Post Slack
          # summary" step is unconditional -- it would post an empty-plan "nothing to
          # dispatch" message for a job nobody wants triage to look at in the first
          # place.
          failed=$(jq -r --argjson countable "$countable" '
            .jobs[]
            | select(.conclusion as $c | $countable | index($c))
            | .name
            | select(startswith("AlwaysGreen ") | not)
            | select(startswith("AI Agent E2E Tests") | not)
            | select(startswith("AI Agent bundle E2E") | not)
          ' <<<"$jobs_json")

          any_failed=false
          [ -n "$failed" ] && any_failed=true

          # Normalised the way classify.normalise_base_ref does, so the value this gate
          # derives and the value discovery derives cannot disagree. On merge_group,
          # head_branch is the per-PR queue ref, which triage rejects outright.
          base_ref="${HEAD_BRANCH#refs/heads/}"
          case "$base_ref" in
            gh-readonly-queue/*)
              base_ref="${base_ref#gh-readonly-queue/}"
              base_ref="${base_ref%/pr-*}"
              ;;
          esac

          # Mirrors what the central triage accepts for this repository
          # (camunda/c8-cross-component-e2e-tests, scripts/alwaysgreen/consumers.py,
          # `supported_base_refs`) and what alwaysgreen-fix.yml accepts. All three are
          # widened together, or a dispatch hard-errors on arrival. The contract now
          # spans two repositories, so no test can hold both ends.
          #
          # Every supported ref must resolve to its own e2e suite. alwaysgreen-fix.yml
          # maps main to the next unreleased minor and stable/X.Y to X.Y; if two refs ever
          # resolve to the same suite again (main lagging a branch cut), they share spec
          # paths while carrying different dispatch keys. The key lock, the in-flight
          # check and triage's concurrency group are all keyed by ref, so none of them
          # would see two agents editing the same files. Drop the lagging ref from the
          # three lists until main moves on.
          base_ref_supported=true
          case "$base_ref" in
            main|stable/8.7|stable/8.8|stable/8.9|stable/8.10) ;;
            *) base_ref_supported=false ;;
          esac

          {
            echo "## AlwaysGreen failure watch"
            echo ""
            echo "Run: ${RUN_URL} (\`${RUN_CONCLUSION}\`) on \`${base_ref}\`"
            echo ""
            if [ "$any_failed" != "true" ]; then
              echo "No failing jobs. Nothing to triage."
            elif [ "$already_triaged" = "true" ]; then
              echo "This branch still triages in-pipeline, and that job already"
              echo "classified this run — not classifying it a second time."
              echo "Replay it explicitly if you want a second classification."
              echo ""
              printf '%s\n' "$failed" | sed 's/^/- /'
            elif [ "$base_ref_supported" = "true" ]; then
              echo "Failing jobs, handed to triage:"
              echo ""
              printf '%s\n' "$failed" | sed 's/^/- /'
            else
              echo "Failing jobs on \`${base_ref}\`, a ref AlwaysGreen triage does not"
              echo "accept -- reported here only, no classification or fix dispatch ran:"
              echo ""
              printf '%s\n' "$failed" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$any_failed" = "true" ]; then
            printf 'Failing jobs:\n%s\n' "$failed"
            if [ "$already_triaged" = "true" ]; then
              echo "In-pipeline triage already classified run ${RUN_ID}; skipping to avoid a duplicate."
            fi
            if [ "$base_ref_supported" != "true" ]; then
              echo "::warning::AlwaysGreen triage does not accept base_ref '${base_ref}', so this run's failures are reported here only. Add the ref to supported_base_refs in camunda/c8-cross-component-e2e-tests and to alwaysgreen-fix.yml here to enable it."
            fi
          else
            echo "No failing jobs in run ${RUN_ID}."
            # A red run with no failing job is a contradiction, and the one that would
            # read as a clean triage. `startup_failure` is the usual cause -- an invalid
            # workflow file produces no jobs at all -- and there is nothing for the fix
            # agent to classify, so say so out loud instead of reporting nothing.
            case "${RUN_CONCLUSION}" in
              failure|startup_failure|timed_out)
                echo "::warning::run ${RUN_ID} concluded '${RUN_CONCLUSION}' but exposes no failing job, so there is nothing to triage. A startup failure or a broken workflow file looks like this."
                {
                  echo ""
                  echo "> Concluded \`${RUN_CONCLUSION}\` with no failing job to classify."
                  echo "> Check the run itself — a startup failure produces no jobs."
                } >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          fi

          {
            echo "any_failed=${any_failed}"
            echo "already_triaged=${already_triaged}"
            echo "base_ref=${base_ref}"
            echo "base_ref_supported=${base_ref_supported}"
          } | tee -a "$GITHUB_OUTPUT"

      # In-pipeline triage used to receive the feedback job's message ts through
      # `needs`, so one failure stayed one Slack thread. From a separate run there is no
      # `needs` edge to read, so the message is looked up instead: post-failure-feedback
      # puts the failing run's URL in its text as `<url|Run>`, which makes the run URL a
      # unique handle on the parent. Same conversations.history technique
      # connectors-streak-detector.yml uses to find its own messages.
      #
      # Entirely best-effort. No parent found -- because the feedback job was skipped by
      # its own blind gate on a stable branch, because the token lacks history scope, or
      # because Slack is down -- just means triage opens its own thread, which is what
      # it does when called with an empty parent anyway.
      - name: Find the feedback message to reply under
        id: parent
        if: steps.scan.outputs.any_failed == 'true'
        env:
          SLACK_TOKEN: ${{ secrets.CONNECTORS_SLACK_BOT_TOKEN }}
          RUN_URL: ${{ steps.run.outputs.url }}
        run: |
          set -euo pipefail
          ts=""
          if [ -n "${SLACK_TOKEN:-}" ]; then
            resp=$(curl -sS --max-time 20 -G \
              "https://slack.com/api/conversations.history" \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              --data-urlencode "channel=${ALERT_CHANNEL_ID}" \
              --data-urlencode "limit=60" || echo '{}')
            if [ "$(jq -r '.ok // false' <<<"$resp")" = "true" ]; then
              # Top-level messages only, but "top-level" is not "has no thread_ts": once
              # a message has replies, Slack returns it with thread_ts EQUAL to its own
              # ts. Testing for absence alone therefore drops the very parent being
              # looked for on any run whose feedback message was already replied to --
              # every replay of a threaded run -- and triage would open a second
              # top-level message beside it. A reply is the case where the two differ.
              #
              # The run URL alone does not identify the feedback message -- the streak
              # job in this same workflow embeds the very same URL as "Latest failing
              # run", and on a run that crosses the threshold it can post or update that
              # message before this lookup. Triage would then reply into the shared
              # per-branch streak thread instead of the per-run feedback thread. The
              # streak markers are the discriminator, and they are right here in `env`.
              ts=$(jq -r --arg url "$RUN_URL" \
                        --arg active "$STREAK_MARKER_ACTIVE" \
                        --arg resolved "$STREAK_MARKER_RESOLVED" '
                [ .messages[]
                  | select((.thread_ts // .ts) == .ts)
                  | select((.text // "") | contains($url))
                  | select((.text // "") | contains($active) | not)
                  | select((.text // "") | contains($resolved) | not) ]
                | first | .ts // ""
              ' <<<"$resp")
            else
              echo "::notice::Slack history lookup unavailable ($(jq -r '.error // "unknown"' <<<"$resp")); triage will open its own thread."
            fi
          fi
          # Paired: triage treats a ts without a channel as no parent at all, so both
          # are emitted together or neither is.
          channel=""
          if [ -n "$ts" ] && [ "$ts" != "null" ]; then
            channel="${ALERT_CHANNEL_ID}"
            echo "Replying under the feedback message at ts=${ts}"
          else
            ts=""
            echo "No feedback message found for this run; triage will open its own thread."
          fi
          {
            echo "slack_ts=${ts}"
            echo "slack_channel=${channel}"
          } | tee -a "$GITHUB_OUTPUT"

  # Hands the failing run to the central AlwaysGreen triage in
  # camunda/c8-cross-component-e2e-tests, which classifies it there. Triage used to
  # live in this repository; it now lives once, for every consumer.
  # See camunda/team-test-automation#163.
  #
  # A dispatch rather than `uses:`: that repository is internal and this one is
  # public, so GitHub refuses to resolve a workflow across that boundary.
  #
  # github.run_id inside triage is triage's own run, not the failing one, so the
  # failing run travels as an explicit `run_id` field in the payload below, which
  # triage reads as `client_payload.run_id || inputs.run_id`.
  #
  # NOTE: that triage DOES start this repository's fix agent, by dispatching
  # alwaysgreen-fix.yml -- the same cross-boundary reason applies to it, so it
  # cannot be reached with `uses:` either. The rule that nothing privileged here
  # could be started from outside was given up deliberately to make that possible;
  # what bounds the agent now is asserted by
  # test_the_fix_agent_is_dispatchable_and_what_now_bounds_it in
  # test_workflow_security.py: protected refs only, the Vault kill switch, an
  # allowlisted base_ref and surface, a dispatch key that must be this pipeline's
  # own, and no `pull-requests: write`.
  triage:
    name: Hand the failure to the central AlwaysGreen triage
    needs: scan-run
    if: >-
      github.ref_protected &&
      needs.scan-run.outputs.any_failed == 'true' &&
      needs.scan-run.outputs.already_triaged != 'true' &&
      needs.scan-run.outputs.base_ref_supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate a token that may dispatch to the triage repository
        id: github-token
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@6c85c5de572dbc1790e5e7b4636c2ad9f5b614d8 # generate-github-app-token-from-vault-secrets: v1.1.0
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/quality-assurance-ci
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: c8-cross-component-e2e-tests

      # A disabled workflow accepts a repository_dispatch and runs nothing, so the
      # POST would succeed and the failure would simply never be triaged. Fatal
      # rather than skipped: the dispatchers in that repository are routinely
      # disabled by hand, and this one going the same way must not be silent.
      - name: Refuse to dispatch at a disabled receiver
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          set -euo pipefail
          state=$(gh api repos/camunda/c8-cross-component-e2e-tests/actions/workflows/alwaysgreen-triage.yml \
            --jq '.state' 2>/dev/null || echo "unknown")
          if [ "$state" != "active" ]; then
            echo "::error::the AlwaysGreen triage receiver is '${state}', so this failure would go untriaged"
            exit 1
          fi

      # Deliberately NOT continue-on-error. A dispatch that fails to arrive means the
      # failure is never triaged, which is the one outcome this system exists to
      # prevent, so it fails the job and is visible.
      - name: Hand the failure to the central triage
        env:
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          RUN_ID: ${{ needs.scan-run.outputs.run_id }}
          BASE_REF: ${{ needs.scan-run.outputs.base_ref }}
          SLACK_TS: ${{ needs.scan-run.outputs.parent_slack_ts }}
          SLACK_CHANNEL: ${{ needs.scan-run.outputs.parent_slack_channel }}
          # A manual replay stays classification-only, as it was when triage ran here.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' || inputs.dry_run || false }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg run_id "${RUN_ID}" \
            --arg base_ref "${BASE_REF}" \
            --arg ts "${SLACK_TS:-}" \
            --arg channel "${SLACK_CHANNEL:-}" \
            --argjson dry_run "${DRY_RUN:-false}" \
            '{event_type: "alwaysgreen-triage",
              client_payload: {source_repo: $repo,
                               run_id: $run_id,
                               base_ref: $base_ref,
                               slack_ts: $ts,
                               slack_channel: $channel,
                               dry_run: $dry_run}}')
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/camunda/c8-cross-component-e2e-tests/dispatches \
            --input - <<<"$payload"
          echo "Handed run ${RUN_ID} to the central triage." >> "$GITHUB_STEP_SUMMARY"
