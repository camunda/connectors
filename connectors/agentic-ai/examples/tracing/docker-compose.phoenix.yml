# Arize Phoenix as a local GenAI tracing backend for the AI Agent OpenTelemetry tracing, following the
# SQLite example of https://arize.com/docs/phoenix/self-hosting/deployment-options/docker
#
#   docker compose -f docker-compose.phoenix.yml up -d
#
# UI:                       http://localhost:6006
# OTLP/HTTP (protobuf):     http://localhost:6006/v1/traces
# OTLP/gRPC:                localhost:4317
#
# Traces are kept in a SQLite database in the `phoenix_data` volume; `docker compose down -v` drops them.
# Local development only.
name: camunda-ai-agent-phoenix

services:
  phoenix:
    image: arizephoenix/phoenix:version-20
    ports:
      - "127.0.0.1:6006:6006" # PHOENIX_PORT: UI and OTLP/HTTP
      - "127.0.0.1:4317:4317" # PHOENIX_GRPC_PORT: OTLP/gRPC
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_TELEMETRY_ENABLED=false
    volumes:
      - phoenix_data:/mnt/data # PHOENIX_WORKING_DIR
volumes:
  phoenix_data:
    driver: local
