camunda.client.mode=self-managed
camunda.client.rest-address=http://localhost:8280
camunda.client.grpc-address=http://localhost:26710
camunda.client.prefer-rest-over-grpc=true
camunda.client.auth.method=basic
camunda.client.auth.username=demo
camunda.client.auth.password=demo
camunda.client.worker.defaults.enabled=false
camunda.process-test.runtime-mode=remote
camunda.process-test.remote.camunda-monitoring-api-address=http://localhost:9710
camunda.process-test.remote.connectors-rest-api-address=http://localhost:8286
camunda.process-test.data-deletion-mode=NONE
camunda.process-test.clock-reset-enabled=false
camunda.process-test.coverage.report-directory=target/live-coverage-report
camunda.process-test.coverage.excluded-processes=CptGateSandboxCleanup
camunda.process-test.assertion.timeout=PT180S
logging.level.root=WARN
logging.level.io.camunda.process.test=INFO
