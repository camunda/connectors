services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/connectors:cached
      - ${SSH_AUTH_SOCK_MOUNT}:/ssh-agent
      - ${HOST_HOME}/.gitconfig:/home/vscode/.gitconfig:ro
      - connectors-maven-cache:/home/vscode/.m2
      - connectors-npm-cache:/home/vscode/.npm
      # Auto-detected by detect-host-env.sh from this host's own git config —
      # a real path if SSH-based commit signing (gpg.format=ssh) is set up,
      # otherwise /dev/null as a harmless no-op. See that script for why.
      - ${SIGNING_PUBKEY_MOUNT_SRC}:${SIGNING_PUBKEY_MOUNT_DST}:ro
    command: sleep infinity

volumes:
  connectors-maven-cache:
  connectors-npm-cache:
